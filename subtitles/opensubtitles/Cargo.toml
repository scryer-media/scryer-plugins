[package]
name = "opensubtitles-subtitle-provider"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"
description = "OpenSubtitles subtitle provider with provider-managed auth, search, and download"

[package.metadata.scryer]
official = true
plugin_id = "opensubtitles"
catalog_versions = ["v3"]
# Scryer 0.20.0 is the first release whose subtitle host serves
# `scryer:subtitle/subtitle-provider@1.1.0`. A host that only serves the 1.0.0
# world (or the Preview 1 command runtime before it) cannot bind this artifact
# at all, so the floor is load-bearing, not advisory.
min_scryer_version = "0.20.0"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/subtitles/opensubtitles"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/subtitles/opensubtitles"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
# Needs no host archive extraction: OpenSubtitles hands
# back a plain `srt` document, so nothing here opens a container.
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
scryer-plugin-sdk = { git = "https://github.com/scryer-media/scryer.git", branch = "release-NEXT", version = "3.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = { version = "0.61", features = ["async"] }

[dev-dependencies]
# The whole host-conformance suite: it links wasmtime and drives the release
# artifact. Dev-dependency only — see the crate's own manifest for why.
scryer-plugin-conformance = { path = "../../pdk/scryer-plugin-conformance", features = [
    "subtitle",
] }

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
