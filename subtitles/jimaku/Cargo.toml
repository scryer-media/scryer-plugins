[package]
name = "jimaku-subtitle-provider"
version = "1.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Anime-focused Jimaku subtitle provider using AniList IDs and optional name fallback"

[package.metadata.scryer]
official = true
plugin_id = "jimaku"
catalog_versions = ["v3"]
# Scryer 0.21.10 is the first release whose subtitle host fills
# `SubtitlePluginSearchRequest::community_entry`, which this version's anime
# episode matching depends on. Older hosts never send the field, so the floor
# is load-bearing, not advisory.
min_scryer_version = "0.21.10"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/subtitles/jimaku"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/subtitles/jimaku"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
# Needs no host archive extraction: Jimaku serves
# archives as-is (see `is_archive`), so nothing here opens one.
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
scryer-plugin-sdk = "3.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = { version = "0.61", features = ["async"] }

[dev-dependencies]
# The whole host-conformance suite: it links wasmtime and drives the release
# artifact. Dev-dependency only — see the crate's own manifest for why.
scryer-plugin-conformance = { path = "../../pdk/scryer-plugin-conformance", features = [
    "subtitle",
] }


[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
