[package]
name = "wizdom-subtitle-provider"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Hebrew subtitle provider for Wizdom with IMDb-keyed search and zip downloads"

[package.metadata.scryer]
official = true
plugin_id = "wizdom"
status = "beta"
catalog_versions = ["v3"]
# Scryer 0.20.0 is the first release whose subtitle host serves
# `scryer:subtitle/subtitle-provider@1.1.0`. A host that only serves the 1.0.0
# world (or the Preview 1 command runtime before it) cannot bind this artifact
# at all, so the floor is load-bearing, not advisory.
# 0.21.21 is the first host that decodes the open error codes this plugin
# sends.
min_scryer_version = "0.21.21"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/subtitles/wizdom"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/subtitles/wizdom"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
# ZIP extraction uses the existing bounded host service through the PDK.
scryer-plugin-pdk = "0.8.0"
scryer-plugin-sdk = "3.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = { version = "0.63", features = ["async"] }

[dev-dependencies]
# The whole host-conformance suite: it links wasmtime and drives the release
# artifact. Dev-dependency only — see the crate's own manifest for why.
scryer-plugin-conformance = { path = "../../pdk/scryer-plugin-conformance", features = [
    "subtitle",
] }

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
