[package]
name = "amenzb-subtitles"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "ameNZB anime subtitle provider using public release subtitle attachments"

[package.metadata.scryer]
official = true
plugin_id = "amenzb-subtitles"
status = "beta"
catalog_versions = ["v3"]
# TEMPORARY — the placeholder for the first Scryer release whose subtitle
# host serves `scryer:subtitle/subtitle-provider@1.1.0`. A host that only
# serves the 1.0.0 world (or the Preview 1 command runtime before it) cannot
# bind this artifact at all, so the floor has to move with that release;
# 0.18.23 is the same placeholder every migrated subtitle provider carries.
# Replace them all with the real version at release.
min_scryer_version = "0.18.23"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/subtitles/amenzb"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/subtitles/amenzb"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
# The one newznab engine, shared with the five indexer plugins rather than
# forked. It was forkable before only because this world could not drive an
# `async` `execute_raw_search`, and its rate gates, retry budget and monotonic
# clock reached the host through `scryer:indexer/host@1.1.0` imports this world
# does not serve. `scryer:subtitle@1.1.0` closes both gaps: `process` is an
# `async func`, and the capabilities the engine needs now live in the
# family-neutral `scryer:runtime/host@1.0.0` that both worlds import. The
# engine names neither world directly — it calls the PDK's world-agnostic
# surfaces, which resolve to whichever runtime the component installed at
# startup — so one crate now serves both shapes and a newznab protocol fix
# reaches ameNZB with everything else.
newznab-common = { path = "../../indexers/newznab-common" }
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
scryer-plugin-sdk = { git = "https://github.com/scryer-media/scryer.git", branch = "release-NEXT", version = "3.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
wit-bindgen = { version = "0.61", features = ["async"] }

[dev-dependencies]
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
wasmtime = "48.0.1"
wasmtime-wasi = "48.0.1"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
