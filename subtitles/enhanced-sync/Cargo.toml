[package]
name = "enhanced-subtitle-sync-plugin"
version = "0.3.0"
edition = "2024"
autolib = false
license = "GPL-3.0-only"
description = "Optional enhanced subtitle sync decoder and audio-transcode plugin with FFmpeg-derived audio codec support"

[package.metadata.scryer]
official = true
plugin_id = "enhanced-subtitle-sync"
catalog_versions = ["v3"]
# TEMPORARY — the placeholder for the first Scryer release whose subtitle
# host serves `scryer:subtitle/subtitle-provider@1.1.0`. A host that only
# serves the 1.0.0 world (or the Preview 1 command runtime before it) cannot
# bind this artifact at all, so the floor has to move with that release;
# 0.18.23 is the same placeholder every migrated subtitle provider carries.
# Replace them all with the real version at release.
min_scryer_version = "0.18.23"
# Both flavors are kept on purpose. Unlike the catalog providers — which are
# I/O-bound and gained nothing from SIMD, so their variants were dropped — this
# is the fleet's one DSP plugin: FFmpeg's decoders, libfvad and the FFT
# correlation are exactly the kernels `simd128`/`relaxed-simd` speed up, and
# the C halves are compiled with `-msimd128`/`-mrelaxed-simd` to match.
feature_sets = [{ required_features = [] }, { required_features = ["simd128", "relaxed-simd"] }]
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/subtitles/enhanced-sync"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/subtitles/enhanced-sync"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
scryer-plugin-sdk = { git = "https://github.com/scryer-media/scryer.git", branch = "release-NEXT", version = "3.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6"
encoding_rs = "0.8"
chardetng = "1.0"
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "flac", "mp3", "vorbis", "pcm", "mkv", "isomp4", "wav"] }
wit-bindgen = { version = "0.61", features = ["async"] }

[build-dependencies]
cc = "1"
tar = "0.4"
zstd = "0.13"

[dev-dependencies]
postcard = { version = "1", features = ["use-std"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "macros"] }
wasmtime = "48.0.1"
wasmtime-wasi = "48.0.1"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
