[package]
name = "tsukihime-subtitles"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Tsukihime anime subtitle provider using cached public subtitle attachments"

[package.metadata.scryer]
official = true
plugin_id = "tsukihime-subtitles"
status = "beta"
catalog_versions = ["v3"]
# TEMPORARY — the placeholder for the first Scryer release whose subtitle
# backing is the `scryer:subtitle/subtitle-provider@1.0.0` component host. A
# Preview 1 command runtime cannot instantiate this artifact at all, so the
# floor has to move with that release; 0.18.23 is the same placeholder the
# archive extractor carries. Replace both with the real version at release.
min_scryer_version = "0.18.23"
feature_sets = [{ required_features = [] }, { required_features = ["simd128", "relaxed-simd"] }]
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/subtitles/tsukihime"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/subtitles/tsukihime"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
# TEMPORARY — the `archive-extract` feature comes out once the SDK release is
# published; see the PDK's own manifest for why it is gated at all. This plugin
# supplies the newer SDK through the `[patch.crates-io]` below, which is what
# lets the gate open here without dragging the unmigrated fleet along.
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0", features = [
    "archive-extract",
] }
scryer-plugin-sdk = "3.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.60"

# TEMPORARY — this entry comes out once the SDK release is published.
#
# `PluginHostRequest::ArchiveExtract` — the generic host-owned extraction
# capability this provider uses to open its `.xz` subtitle attachments —
# exists only in the in-repo SDK that ships with the WASI-component family
# hosts. The published 3.10.0 has no archive capability at all.
#
# Replace this with a plain version bump on the `scryer-plugin-sdk` dependency
# above as soon as the release carrying `ArchiveExtract` is on crates.io.
[patch.crates-io]
scryer-plugin-sdk = { path = "/private/tmp/scryer-host-extraction-capability/crates/scryer-plugin-sdk" }

[dev-dependencies]
postcard = { version = "1", features = ["use-std"] }
wasmtime = "47.0.3"
wasmtime-wasi = "47.0.3"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
