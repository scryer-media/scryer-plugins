[package]
name = "tsukihime-subtitles"
version = "1.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Tsukihime anime subtitle provider using cached public subtitle attachments"

[package.metadata.scryer]
official = true
plugin_id = "tsukihime-subtitles"
status = "beta"
catalog_versions = ["v3"]
# Scryer 0.21.10 is the first release whose subtitle host fills
# `SubtitlePluginSearchRequest::community_entry`, which this version's anime
# episode matching depends on. Older hosts never send the field, so the floor
# is load-bearing, not advisory.
# 0.21.21 is the first host that decodes the open error codes this plugin
# sends.
min_scryer_version = "0.21.21"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/subtitles/tsukihime"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/subtitles/tsukihime"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
scryer-plugin-pdk = "0.8.0"
scryer-plugin-sdk = "3.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = { version = "0.63", features = ["async"] }

[dev-dependencies]
# The whole host-conformance suite: it links wasmtime and drives the release
# artifact. Dev-dependency only — see the crate's own manifest for why.
scryer-plugin-conformance = { path = "../../pdk/scryer-plugin-conformance", features = [
    "subtitle",
] }

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
