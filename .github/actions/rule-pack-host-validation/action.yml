name: rule-pack-host-validation
description: >-
  Validate a generated rule pack on the pinned production Scryer rule runtime.
  The pinned host commit must carry the ignored
  trash_pack_sources_evaluate_on_production_runtime test; the test itself is
  pack-agnostic and reads any schema-v1 pack manifest.

inputs:
  pack-path:
    description: Absolute path of the generated rule-pack manifest to validate
    required: true
  host-sha:
    description: Immutable 40-hex scryer-media/scryer commit to validate against
    required: true

runs:
  using: composite
  steps:
    - name: Require an immutable host revision
      shell: bash
      env:
        HOST_SHA: ${{ inputs.host-sha }}
        PACK_PATH: ${{ inputs.pack-path }}
      run: |
        set -euo pipefail
        [[ "$HOST_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "host validation revision must be an immutable 40-hex commit" >&2; exit 1; }
        test -f "$PACK_PATH" || { echo "rule pack manifest $PACK_PATH does not exist" >&2; exit 1; }

    - name: Check out the pinned production Rego runtime
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: scryer-media/scryer
        ref: ${{ inputs.host-sha }}
        path: .rule-pack-host-validation
        persist-credentials: false

    - name: Keep the validation checkout outside generated content
      shell: bash
      run: mv "$GITHUB_WORKSPACE/.rule-pack-host-validation" "$RUNNER_TEMP/rule-pack-host-validation"

    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

    - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
      with:
        tool: nextest

    - name: Validate the generated Rego on the production runtime
      shell: bash
      env:
        SCRYER_TRASH_PACK: ${{ inputs.pack-path }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/rule-pack-host-validation"
        test -f crates/scryer-rules/src/trash_pack_validation.rs || { echo "pinned host checkout lacks the required validation harness" >&2; exit 1; }
        cargo nextest run --locked -p scryer-rules --lib -E 'test(trash_pack_sources_evaluate_on_production_runtime)' --run-ignored only --no-fail-fast
