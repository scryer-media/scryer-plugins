name: cardigann-daily-refresh

# Refreshes the Advanced indexers plugin's (cardigann-engine) baked definition
# corpus from upstream Prowlarr/Indexers once a day, the same way the TRaSH and
# SeaDex rule packs refresh: a signed bot commit on a pull request held to a
# generated-only diff. Once it is merged, rule-pack-publish releases the patch
# it bumps (gated separately by CARDIGANN_AUTO_RELEASE_ENABLED). This replaces
# the former weekly cardigann-definitions sync.
#
# Definitions decide where tracker credentials are sent, so the pull request
# only queues itself to auto-merge when the sync's risk report flags nothing:
# no definition that was already baked and references a secret setting gained
# an origin it may reach or changed a templated endpoint host (compared as
# text, since only the default configuration is rendered), none rendered a
# secret somewhere new, and none
# stopped declaring a password setting as a password. Otherwise it stays open
# for a maintainer, listing what was flagged. A definition with no secret, such
# as a public tracker adding mirrors, may gain origins without review.
# The baseline is the corpus on main, which the crate the sync runs was built
# from.
#
# Order of checks, cheapest first:
# 1. `upstream` (no checkout, no toolchain): if the git tree of upstream
#    `definitions/` equals the one recorded in
#    indexers/cardigann-engine/known_cardigann_definitions.upstream.json,
#    nothing moved and the run ends green with no further checks. Keying on
#    the whole `definitions/` tree means unrelated Prowlarr commits never
#    trigger a run, while a new definitions/vN still counts as a move.
# 2. `refresh`, only when something moved: the layout guard fails the run
#    (red, nothing committed, merged or released) when a definitions/vN newer
#    than the tracked one (v12) appears and is not listed in the record's
#    reviewed acknowledged_version_dirs, a source directory the corpus draws
#    from (v11 or v12) disappears, or either source's schema.json blob differs
#    from the recorded one. Then the sync, which takes each definition from the
#    highest source directory that has it, as Prowlarr's v12 reader does.
# 3. A sync whose regenerated corpus is byte-identical (upstream moved only
#    definitions the gate excludes, or files the corpus does not bake) also
#    ends green with nothing committed. The record is deliberately not
#    advanced in that case: a record-only commit would open a pull request
#    that ships nothing, and any change under the crate directory
#    marks cardigann-engine changed for `release-changed`. The cost is that
#    later runs re-sync until a baked definition changes, which upstream does
#    most days.
#
# The engine's own admission gate decides what may be baked, so this never
# ships a definition the engine cannot execute; anything that fails is
# excluded and listed in the pull request body.

on:
  schedule:
    # 05:37 UTC daily = 11:37 PM MDT / 10:37 PM MST the previous evening;
    # clear of trash-daily-refresh (04:23 UTC) and seadex-daily-refresh (04:53 UTC).
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      definitions_ref:
        description: "Prowlarr/Indexers ref to resolve to an immutable commit"
        required: false
        default: master
        type: string

permissions: read-all

concurrency:
  group: cardigann-daily-refresh
  cancel-in-progress: false

env:
  REFRESH_BRANCH: feature/cardigann-daily-refresh
  UPSTREAM_REPOSITORY: Prowlarr/Indexers
  DEFINITIONS_REF: ${{ inputs.definitions_ref || 'master' }}
  CARDIGANN_CRATE_DIR: indexers/cardigann-engine
  CARDIGANN_RECORD: indexers/cardigann-engine/known_cardigann_definitions.upstream.json

jobs:
  upstream:
    if: ${{ vars.CARDIGANN_REFRESH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      moved: ${{ steps.compare.outputs.moved }}
      commit: ${{ steps.compare.outputs.commit }}
      short: ${{ steps.compare.outputs.short }}
      definitions_tree: ${{ steps.compare.outputs.definitions_tree }}
    steps:
      - name: Stop when upstream definitions have not moved
        id: compare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(gh api "repos/${UPSTREAM_REPOSITORY}/commits/${DEFINITIONS_REF}" --jq '.sha')"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "could not resolve ${UPSTREAM_REPOSITORY}@${DEFINITIONS_REF}" >&2; exit 1; }
          definitions_tree="$(gh api "repos/${UPSTREAM_REPOSITORY}/git/trees/${commit}:definitions" --jq '.sha')"
          [[ "$definitions_tree" =~ ^[0-9a-f]{40}$ ]] || { echo "could not read definitions/ at ${commit}" >&2; exit 1; }
          recorded="$(gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${GITHUB_REPOSITORY}/contents/${CARDIGANN_RECORD}?ref=main" | jq -r '.definitions_tree')"
          {
            echo "commit=$commit"
            echo "short=${commit:0:12}"
            echo "definitions_tree=$definitions_tree"
          } >> "$GITHUB_OUTPUT"
          if [ "$definitions_tree" = "$recorded" ]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            echo "Upstream definitions/ is still tree ${definitions_tree}; nothing to refresh." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
            echo "Upstream definitions/ moved to tree ${definitions_tree} at ${commit} (recorded: ${recorded:-none})." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  refresh:
    needs: upstream
    if: ${{ needs.upstream.outputs.moved == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    env:
      UPSTREAM_COMMIT: ${{ needs.upstream.outputs.commit }}
      UPSTREAM_DEFINITIONS_TREE: ${{ needs.upstream.outputs.definitions_tree }}
      RULE_PACK_REFRESH_TOKEN: ${{ secrets.RULE_PACK_REFRESH_TOKEN }}
      RULE_PACK_REFRESH_SIGNING_KEY: ${{ secrets.RULE_PACK_REFRESH_SIGNING_KEY }}
      RULE_PACK_REFRESH_ALLOWED_SIGNERS: ${{ vars.RULE_PACK_REFRESH_ALLOWED_SIGNERS }}
      RULE_PACK_REFRESH_BOT_EMAIL: ${{ vars.RULE_PACK_REFRESH_BOT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          # The bot token pushes the refresh branch; a missing one is reported
          # after the layout guard, which must run first.
          token: ${{ secrets.RULE_PACK_REFRESH_TOKEN || github.token }}

      - name: Capture the integration base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main
          git checkout --detach origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refuse a moved upstream definition layout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UPSTREAM_LISTINGS="$RUNNER_TEMP/cardigann-upstream"
          mkdir -p "$UPSTREAM_LISTINGS"
          gh api "repos/${UPSTREAM_REPOSITORY}/git/trees/${UPSTREAM_COMMIT}:definitions" > "$UPSTREAM_LISTINGS/definitions.json"
          observed="$(jq -r '.sha' "$UPSTREAM_LISTINGS/definitions.json")"
          if [ "$observed" != "$UPSTREAM_DEFINITIONS_TREE" ]; then
            echo "definitions/ at ${UPSTREAM_COMMIT} is ${observed}, not the ${UPSTREAM_DEFINITIONS_TREE} the short circuit saw" >&2
            exit 1
          fi
          source_dirs="$(jq -r '[.source_versions[].dir] | join(" ")' "$CARDIGANN_RECORD")"
          echo "SOURCE_VERSION_DIRS=$source_dirs" >> "$GITHUB_ENV"
          # One listing per source directory that exists upstream; the guard
          # reports any that does not.
          version_args=()
          for dir in $source_dirs; do
            tree="$(jq -r --arg dir "$dir" '.tree[] | select(.path == $dir and .type == "tree") | .sha' "$UPSTREAM_LISTINGS/definitions.json")"
            if [ -n "$tree" ]; then
              gh api "repos/${UPSTREAM_REPOSITORY}/git/trees/${tree}" > "$UPSTREAM_LISTINGS/${dir}.json"
              version_args+=(--version-tree "${dir}=$UPSTREAM_LISTINGS/${dir}.json")
            fi
          done
          cd rule_packs/refresh
          go run . cardigann-guard \
            --record "$GITHUB_WORKSPACE/$CARDIGANN_RECORD" \
            --definitions-tree "$UPSTREAM_LISTINGS/definitions.json" \
            "${version_args[@]}"

      - name: Run helper unit tests
        working-directory: rule_packs/refresh
        run: go test ./...

      - name: Require configured refresh credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RULE_PACK_REFRESH_TOKEN" || { echo "RULE_PACK_REFRESH_TOKEN is required" >&2; exit 1; }
          test -n "$RULE_PACK_REFRESH_SIGNING_KEY" || { echo "RULE_PACK_REFRESH_SIGNING_KEY is required for signed commits" >&2; exit 1; }
          test -n "$RULE_PACK_REFRESH_ALLOWED_SIGNERS" || { echo "RULE_PACK_REFRESH_ALLOWED_SIGNERS is required" >&2; exit 1; }
          test -n "$RULE_PACK_REFRESH_BOT_EMAIL" || { echo "RULE_PACK_REFRESH_BOT_EMAIL is required" >&2; exit 1; }

      - name: Fetch the pinned upstream definitions
        shell: bash
        run: |
          set -euo pipefail
          # Outside the workspace, so verify-diff never sees it as untracked.
          upstream="$RUNNER_TEMP/prowlarr-indexers"
          git init -q "$upstream"
          git -C "$upstream" remote add origin "https://github.com/${UPSTREAM_REPOSITORY}.git"
          sparse=()
          for dir in $SOURCE_VERSION_DIRS; do
            sparse+=("definitions/${dir}")
          done
          git -C "$upstream" sparse-checkout set "${sparse[@]}"
          git -C "$upstream" fetch -q --depth 1 --filter=blob:none origin "$UPSTREAM_COMMIT"
          git -C "$upstream" checkout -q --detach FETCH_HEAD
          test "$(git -C "$upstream" rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          test "$(git -C "$upstream" rev-parse HEAD:definitions)" = "$UPSTREAM_DEFINITIONS_TREE"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            xtask -> xtask/target
            indexers/cardigann-engine -> indexers/cardigann-engine/target

      - name: Sync the bundled definitions
        working-directory: xtask
        run: |
          set -euo pipefail
          cargo run --locked -- cardigann sync-definitions \
            --source "$RUNNER_TEMP/prowlarr-indexers/definitions" \
            --report "$RUNNER_TEMP/cardigann-sync-report.json"

      - name: Stop when the baked corpus is byte-identical
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            "$CARDIGANN_CRATE_DIR/known_cardigann_definitions.v1.jsonl" \
            "$CARDIGANN_CRATE_DIR/known_cardigann_definitions.v1.bodies.jsonl"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream moved, but the baked corpus is byte-identical; nothing committed or released." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump the crate patch version and record the upstream
        if: ${{ steps.changed.outputs.changed == 'true' }}
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          from pathlib import Path

          crate = Path(os.environ["CARDIGANN_CRATE_DIR"])
          manifest = crate / "Cargo.toml"
          text = manifest.read_text(encoding="utf-8")
          match = re.search(r'(?m)^version = "(\d+)\.(\d+)\.(\d+)"$', text)
          if match is None:
              raise SystemExit("could not find the crate version")
          major, minor, patch = (int(part) for part in match.groups())
          previous = f"{major}.{minor}.{patch}"
          bumped = f"{major}.{minor}.{patch + 1}"
          manifest.write_text(
              text[: match.start()] + f'version = "{bumped}"' + text[match.end() :],
              encoding="utf-8",
          )
          # The crate's own lockfile entry, edited directly so no dependency
          # is re-resolved; `cargo test --locked` below proves it consistent.
          lockfile = crate / "Cargo.lock"
          lock = lockfile.read_text(encoding="utf-8")
          entry = f'name = "cardigann-engine"\nversion = "{previous}"\n'
          if lock.count(entry) != 1:
              raise SystemExit("could not find the crate's own Cargo.lock entry")
          lockfile.write_text(
              lock.replace(entry, f'name = "cardigann-engine"\nversion = "{bumped}"\n'),
              encoding="utf-8",
          )
          print(f"previous={previous}")
          print(f"bumped={bumped}")
          PY
          UPSTREAM_LISTINGS="$RUNNER_TEMP/cardigann-upstream"
          cd rule_packs/refresh
          # The guard passed, so every source directory has a listing.
          version_args=()
          for dir in $SOURCE_VERSION_DIRS; do
            version_args+=(--version-tree "${dir}=$UPSTREAM_LISTINGS/${dir}.json")
          done
          go run . cardigann-record \
            --record "$GITHUB_WORKSPACE/$CARDIGANN_RECORD" \
            --commit "$UPSTREAM_COMMIT" \
            --definitions-tree "$UPSTREAM_LISTINGS/definitions.json" \
            "${version_args[@]}"

      - name: Re-check the crate against the refreshed corpus
        if: ${{ steps.changed.outputs.changed == 'true' }}
        working-directory: ${{ env.CARDIGANN_CRATE_DIR }}
        run: cargo test --locked

      - name: Enforce generated-only diff
        if: ${{ steps.changed.outputs.changed == 'true' }}
        working-directory: rule_packs/refresh
        run: go run . verify-diff --profile cardigann --base "${{ steps.base.outputs.sha }}"

      - name: Render the pull request body
        if: ${{ steps.changed.outputs.changed == 'true' }}
        id: body
        shell: bash
        env:
          PREVIOUS_VERSION: ${{ steps.version.outputs.previous }}
          BUMPED_VERSION: ${{ steps.version.outputs.bumped }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/cardigann-refresh-pr.md"
          import json
          import os

          report = json.load(open(os.environ["RUNNER_TEMP"] + "/cardigann-sync-report.json"))
          risk = report["risk"]
          flagged = risk["flagged"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"auto_merge={'false' if flagged else 'true'}\n")
          commit = os.environ["UPSTREAM_COMMIT"]
          excluded = report["excluded"]
          sources = " and ".join(f"`{version}`" for version in report["source_versions"])
          by_version = ", ".join(
              f"{count} from `{version}`" for version, count in report["accepted_by_version"].items()
          )

          print("Generated-only refresh of the bundled Cardigann definition corpus from")
          print(f"[Prowlarr/Indexers@{commit[:12]}](https://github.com/Prowlarr/Indexers/tree/{commit}/definitions),")
          print(f"taking each definition from the highest of {sources} that has it.")
          print()
          print(f"- Crate version: `{os.environ['PREVIOUS_VERSION']}` -> `{os.environ['BUMPED_VERSION']}`")
          print(f"- Upstream `definitions/` tree: `{os.environ['UPSTREAM_DEFINITIONS_TREE']}`")
          print(f"- Candidates: {report['candidates']}")
          print(f"- Baked: {report['accepted']} ({by_version})")
          print(f"- Excluded: {len(excluded)}")
          print(f"- Changed: {len(risk['changed'])}, added: {len(risk['added'])}, removed: {len(risk['removed'])}")
          print()

          def capped(items, limit=10):
              shown = ", ".join(f"`{item}`" for item in items[:limit])
              return shown + (f" and {len(items) - limit} more" if len(items) > limit else "")

          if flagged:
              print("### Review needed")
              print()
              print("This pull request does not auto-merge. These definitions were baked before")
              print("and now reach new origins while holding a secret, render a secret somewhere")
              print("new, or no longer declare a password setting as a password. Check each")
              print("before merging.")
              print()
              print("| Definition | New origins | New secret placements | Weakened settings |")
              print("| --- | --- | --- | --- |")
              for item in flagged:
                  origins = capped(item["new_origins"] + [f"templated {authority}" for authority in item["new_templated_authorities"]])
                  if item["unresolved"]:
                      reason = item["unresolved"].replace("|", "\\|").replace("\n", " ")[:300]
                      origins = f"could not resolve: {reason}"
                  print(f"| `{item['id']}` | {origins} | {capped(item['new_secret_placements'])} | {capped(item['weakened_settings'])} |")
          else:
              print("No definition that was already baked and holds a secret gained an origin,")
              print("rendered a secret somewhere new, or weakened a password setting, so this")
              print("pull request merges itself once checks pass.")
          print()
          if risk["secretless_new_origins"]:
              print(f"New origins on definitions that hold no secret: {capped(risk['secretless_new_origins'], 50)}")
              print()
          if risk["added"]:
              print(f"New definitions, not configured by anyone yet: {capped(risk['added'], 50)}")
              print()
          if risk["removed"]:
              print(f"Removed definitions, which stop working for anyone using them: {capped(risk['removed'], 50)}")
              print()
          if excluded:
              print("### Excluded definitions")
              print()
              print("These did not parse, validate, or reach a first HTTP request under this")
              print("engine, so they were left out rather than shipped broken.")
              print()
              print("| Definition | Source | Reason |")
              print("| --- | --- | --- |")
              # Stay well inside GitHub's 65536-character body limit.
              budget = 55000
              for index, item in enumerate(excluded):
                  reason = item["reason"].replace("|", "\\|").replace("\n", " ")
                  if len(reason) > 300:
                      reason = reason[:297] + "..."
                  row = f"| `{item['file']}` | `{item['source_version']}` | {reason} |"
                  budget -= len(row) + 1
                  if budget < 0:
                      print(f"| ... | | {len(excluded) - index} more; see the workflow run log |")
                      break
                  print(row)
          else:
              print("Every candidate definition cleared the gate.")
          print()
          print("Merging releases this patch through the rule-pack-publish workflow when")
          print("CARDIGANN_AUTO_RELEASE_ENABLED is on; otherwise it waits for a normal release.")
          PY

      - name: Commit and open the signed refresh pull request
        if: ${{ steps.changed.outputs.changed == 'true' }}
        uses: ./.github/actions/rule-pack-refresh-pr
        with:
          branch: ${{ env.REFRESH_BRANCH }}
          pack-label: Cardigann definitions
          version: ${{ steps.version.outputs.bumped }}
          fingerprint: ${{ needs.upstream.outputs.definitions_tree }}
          title: "chore: sync bundled Cardigann definitions to ${{ needs.upstream.outputs.short }} (cardigann-engine ${{ steps.version.outputs.bumped }})"
          body-file: ${{ runner.temp }}/cardigann-refresh-pr.md
          paths: |
            indexers/cardigann-engine/known_cardigann_definitions.v1.jsonl
            indexers/cardigann-engine/known_cardigann_definitions.v1.bodies.jsonl
            indexers/cardigann-engine/known_cardigann_definitions.upstream.json
            indexers/cardigann-engine/Cargo.toml
            indexers/cardigann-engine/Cargo.lock
          auto-merge: ${{ steps.body.outputs.auto_merge }}
          token: ${{ secrets.RULE_PACK_REFRESH_TOKEN }}
          signing-key: ${{ secrets.RULE_PACK_REFRESH_SIGNING_KEY }}
          allowed-signers: ${{ vars.RULE_PACK_REFRESH_ALLOWED_SIGNERS }}
          bot-email: ${{ vars.RULE_PACK_REFRESH_BOT_EMAIL }}
