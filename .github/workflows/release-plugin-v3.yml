name: release-plugin-v3

on:
  push:
    tags:
      - "plugins-v3/release/*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Release tag or commit to publish"
        required: true
        type: string
      release_commit:
        description: "Commit that owns the plugin version tags to publish"
        required: false
        type: string
      plugin_ids:
        description: "Whitespace or comma separated plugin ids to publish from current manifests"
        required: false
        type: string
      catalog_repair_specs:
        description: "Catalog-only repair specs formatted as plugin_id@version; skips plugin builds"
        required: false
        type: string

permissions: read-all

env:
  RELEASE_PLUGIN_CACHE_SCOPE: release-plugin-v3
  RELEASE_PLUGIN_PLAN_SCCACHE_LANE: linux-host-xtask
  RELEASE_PLUGIN_PLAN_SCCACHE_BUILD_FLAVOR: xtask-release
  RELEASE_PLUGIN_BUILD_SCCACHE_LANE: linux-wasm32-wasip1-plugin-release
  RELEASE_PLUGIN_BUILD_SCCACHE_BUILD_FLAVOR: plugin-release
  SCCACHE_VERSION: v0.10.0
  WASI_SDK_VERSION: "33.0"
  WASI_SDK_RELEASE_TAG: wasi-sdk-33
  BINARYEN_RELEASE_TAG: version_129
  WASM_TOOLS_VERSION: "1.253.0"
  CF_JURISDICTION_URL: ${{ secrets.CF_JURISDICTION_URL }}
  CF_R2_PUBLIC_BASE_URL: https://cdn.scryer.media/scryer
  SCRYER_OFFICIAL_RELEASE_WORKFLOW_PATH: .github/workflows/release-plugin-v3.yml
  SCRYER_OFFICIAL_PLUGIN_RELEASE_TAG_PREFIX: plugins-v3
  SCRYER_CATALOG_V3_RELEASE_TAG: catalog/v3
  SCRYER_CATALOG_V3_PATH_PREFIX: catalog/v3

jobs:
  plan-release:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.catalog_repair_specs == '' }}
    outputs:
      plugin_matrix: ${{ steps.plugin-plans.outputs.matrix }}
    runs-on: ubuntu-latest
    env:
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_R2_BUCKET_ID: ${{ vars.CF_R2_BUCKET_ID }}
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      GH_TOKEN: ${{ github.token }}
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: /home/runner/work/scryer-plugins/scryer-plugins
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gha-rust-cache-linux-${{ env.RELEASE_PLUGIN_CACHE_SCOPE }}-xtask
          workspaces: |
            xtask -> xtask/target
          cache-targets: "false"
          cache-workspace-crates: "false"
          key: xtask-release

      - name: Restore sccache directory
        id: validate-sccache-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/sccache
          key: gha-sccache-v2-${{ env.RELEASE_PLUGIN_CACHE_SCOPE }}-${{ env.RELEASE_PLUGIN_PLAN_SCCACHE_LANE }}-${{ env.RELEASE_PLUGIN_PLAN_SCCACHE_BUILD_FLAVOR }}-${{ github.run_id }}
          restore-keys: |
            gha-sccache-v2-${{ env.RELEASE_PLUGIN_CACHE_SCOPE }}-${{ env.RELEASE_PLUGIN_PLAN_SCCACHE_LANE }}-${{ env.RELEASE_PLUGIN_PLAN_SCCACHE_BUILD_FLAVOR }}-
            gha-sccache-v2-${{ env.RELEASE_PLUGIN_CACHE_SCOPE }}-${{ env.RELEASE_PLUGIN_PLAN_SCCACHE_LANE }}-

      - name: Install sccache
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) archive="sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" ;;
            aarch64|arm64) archive="sccache-${SCCACHE_VERSION}-aarch64-unknown-linux-musl.tar.gz" ;;
            *)
              echo "Unsupported architecture for sccache: $(uname -m)" >&2
              exit 1
              ;;
          esac
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/${archive}" -o "${tmpdir}/${archive}"
          tar -xzf "${tmpdir}/${archive}" -C "${tmpdir}"
          install -d "${CARGO_HOME}/bin"
          install -m 0755 "${tmpdir}"/sccache-*/sccache "${CARGO_HOME}/bin/sccache"
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
          sccache --version

      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Build xtask once
        run: cargo build --locked --profile xtask-release --manifest-path xtask/Cargo.toml --bin xtask

      - name: Select plugin release plan
        run: |
          set -euo pipefail
          PLUGIN_IDS_INPUT="${{ github.event_name == 'workflow_dispatch' && inputs.plugin_ids || '' }}"
          if [ -n "${PLUGIN_IDS_INPUT//[[:space:],]/}" ]; then
            mapfile -t plugin_ids < <(
              printf '%s\n' "${PLUGIN_IDS_INPUT}" \
                | tr ',[:space:]' '\n' \
                | awk 'NF'
            )
            if [ "${#plugin_ids[@]}" -eq 0 ]; then
              echo "No plugin ids were provided" >&2
              exit 1
            fi
            ./xtask/target/xtask-release/xtask official plan-current "${plugin_ids[@]}" > release-plan.tsv
            printf 'Selected current plugin release plan\n'
            while IFS=$'\t' read -r plugin_id version; do
              printf ' - %s %s\n' "${plugin_id}" "${version}"
            done < release-plan.tsv
            exit 0
          fi

          RELEASE_SHA="${{ github.event_name == 'workflow_dispatch' && inputs.release_commit || '' }}"
          if [ -z "${RELEASE_SHA}" ]; then
            RELEASE_SHA="$(git rev-parse HEAD)"
          fi
          mapfile -t plugin_tags < <(
            git tag --points-at "${RELEASE_SHA}" \
              | sort \
              | grep -E '^plugins-v3/[^/]+/v.+$' \
              || true
          )
          if [ "${#plugin_tags[@]}" -eq 0 ]; then
            echo "No plugin release tags point at ${RELEASE_SHA}" >&2
            exit 1
          fi
          : > release-plan.tsv
          for tag in "${plugin_tags[@]}"; do
            plugin_spec="${tag#plugins-v3/}"
            plugin_id="${plugin_spec%/v*}"
            version="${tag##*/v}"
            printf '%s\t%s\n' "${plugin_id}" "${version}" >> release-plan.tsv
          done
          printf 'Selected plugin release plan for %s\n' "${RELEASE_SHA}"
          while IFS=$'\t' read -r plugin_id version; do
            printf ' - %s %s\n' "${plugin_id}" "${version}"
          done < release-plan.tsv

      - name: Build plugin release matrix
        id: plugin-plans
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = []
          for line in Path("release-plan.tsv").read_text().splitlines():
              plugin_id, version = line.split("\t", 1)
              rows.append({"plugin_id": plugin_id, "version": version})

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"matrix={json.dumps({'include': rows})}\n")
          PY

      - name: Show sccache stats
        if: always()
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats | tee validate-sccache-stats.txt
          else
            echo "sccache unavailable" | tee validate-sccache-stats.txt
          fi

      - name: Upload xtask artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plugin-v3-xtask-${{ github.run_id }}
          path: xtask/target/xtask-release/xtask
          if-no-files-found: error
          retention-days: 7

      - name: Upload release plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plugin-v3-plan-${{ github.run_id }}
          path: |
            release-plan.tsv
          if-no-files-found: error
          retention-days: 7

      - name: Upload validate stats
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plugin-v3-validate-${{ github.run_id }}
          path: validate-sccache-stats.txt
          if-no-files-found: error
          retention-days: 7

  build-sign-release-plugin:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.catalog_repair_specs == '' }}
    needs: [plan-release]
    name: validate-build-sign-release (${{ matrix.plugin_id }} ${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-release.outputs.plugin_matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_R2_BUCKET_ID: ${{ vars.CF_R2_BUCKET_ID }}
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      GH_TOKEN: ${{ github.token }}
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: /home/runner/work/scryer-plugins/scryer-plugins
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gha-rust-cache-linux-${{ env.RELEASE_PLUGIN_CACHE_SCOPE }}-plugin-build
          workspaces: |
            xtask -> xtask/target
            download_clients/qbittorrent -> download_clients/qbittorrent/target
            indexers/dognzb -> indexers/dognzb/target
            indexers/newznab -> indexers/newznab/target
            indexers/nzbgeek -> indexers/nzbgeek/target
            indexers/torrent-rss -> indexers/torrent-rss/target
            indexers/torznab -> indexers/torznab/target
            notifications/email -> notifications/email/target
            notifications/jellyfin -> notifications/jellyfin/target
            notifications/webhook -> notifications/webhook/target
            subtitles/jimaku -> subtitles/jimaku/target
            subtitles/opensubtitles -> subtitles/opensubtitles/target
            subtitles/subdl -> subtitles/subdl/target
            subtitles/enhanced-sync -> subtitles/enhanced-sync/target
          cache-targets: "false"
          cache-workspace-crates: "false"
          key: plugin-release

      - name: Restore sccache directory
        id: prepare-sccache-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/sccache
          key: gha-sccache-v2-${{ env.RELEASE_PLUGIN_CACHE_SCOPE }}-${{ env.RELEASE_PLUGIN_BUILD_SCCACHE_LANE }}-${{ env.RELEASE_PLUGIN_BUILD_SCCACHE_BUILD_FLAVOR }}-${{ matrix.plugin_id }}-${{ github.run_id }}
          restore-keys: |
            gha-sccache-v2-${{ env.RELEASE_PLUGIN_CACHE_SCOPE }}-${{ env.RELEASE_PLUGIN_BUILD_SCCACHE_LANE }}-${{ env.RELEASE_PLUGIN_BUILD_SCCACHE_BUILD_FLAVOR }}-
            gha-sccache-v2-${{ env.RELEASE_PLUGIN_CACHE_SCOPE }}-${{ env.RELEASE_PLUGIN_BUILD_SCCACHE_LANE }}-

      - name: Install release tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pip zstd
          python3 -m pip install --user --require-hashes -r .github/awscli-requirements.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          case "$(uname -m)" in
            x86_64)
              binaryen_archive="binaryen-${BINARYEN_RELEASE_TAG}-x86_64-linux.tar.gz"
              wasm_tools_archive="wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz"
              wasm_tools_sha256="4e2898f7ca3bd0536218ed9b7b36ff7b86954c57ae0e6272fde69728cbe01088"
              ;;
            aarch64|arm64)
              binaryen_archive="binaryen-${BINARYEN_RELEASE_TAG}-aarch64-linux.tar.gz"
              wasm_tools_archive="wasm-tools-${WASM_TOOLS_VERSION}-aarch64-linux.tar.gz"
              wasm_tools_sha256="4a9a1c6a0885aaf17f433f2927bd61b1fe40069836f750f4e9f9ccd661106c65"
              ;;
            *)
              echo "Unsupported architecture for binaryen: $(uname -m)" >&2
              exit 1
              ;;
          esac
          wasi_sdk_archive="wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          binaryen_url="https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_RELEASE_TAG}/${binaryen_archive}"
          wasm_tools_url="https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/${wasm_tools_archive}"
          wasi_sdk_url="https://github.com/WebAssembly/wasi-sdk/releases/download/${WASI_SDK_RELEASE_TAG}/${wasi_sdk_archive}"
          tmpdir="$(mktemp -d)"
          curl -fsSL "$binaryen_url" -o "$tmpdir/$binaryen_archive"
          curl -fsSL "$wasm_tools_url" -o "$tmpdir/$wasm_tools_archive"
          curl -fsSL "$wasi_sdk_url" -o "$tmpdir/$wasi_sdk_archive"
          printf '%s  %s\n' "$wasm_tools_sha256" "$tmpdir/$wasm_tools_archive" | sha256sum --check --strict
          tar -xzf "$tmpdir/$binaryen_archive" -C "$tmpdir"
          tar -xzf "$tmpdir/$wasm_tools_archive" -C "$tmpdir"
          sudo install -m 0755 "$tmpdir"/binaryen-*/bin/wasm-opt /usr/local/bin/wasm-opt
          sudo install -m 0755 "$tmpdir"/wasm-tools-*/wasm-tools /usr/local/bin/wasm-tools
          wasm-opt --version
          wasm-tools --version
          wasi_sdk_root="${RUNNER_TEMP}/wasi-sdk-${WASI_SDK_VERSION}"
          rm -rf "$wasi_sdk_root"
          mkdir -p "$wasi_sdk_root"
          tar -xzf "$tmpdir/$wasi_sdk_archive" -C "$wasi_sdk_root" --strip-components=1
          if [ ! -d "$wasi_sdk_root/bin" ] || [ ! -d "$wasi_sdk_root/share/wasi-sysroot" ]; then
            echo "failed to extract wasi-sdk root" >&2
            exit 1
          fi
          {
            echo "$wasi_sdk_root/bin"
          } >> "$GITHUB_PATH"
          {
            echo "WASI_SYSROOT=$wasi_sdk_root/share/wasi-sysroot"
            echo "FFMPEG_WASI_SYSROOT=$wasi_sdk_root/share/wasi-sysroot"
            echo "CLANG=$wasi_sdk_root/bin/clang"
            echo "LLVM_AR=$wasi_sdk_root/bin/llvm-ar"
            echo "LLVM_NM=$wasi_sdk_root/bin/llvm-nm"
            echo "LLVM_RANLIB=$wasi_sdk_root/bin/llvm-ranlib"
            echo "LLVM_STRIP=$wasi_sdk_root/bin/llvm-strip"
          } >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Validate WASI sysroot
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WASI_SYSROOT:-}" ] || [ ! -d "${WASI_SYSROOT}" ]; then
            echo "WASI sysroot not found after installing wasi-sdk" >&2
            exit 1
          fi
          if [ -z "${CLANG:-}" ] || [ ! -x "${CLANG}" ]; then
            echo "WASI clang not found after installing wasi-sdk" >&2
            exit 1
          fi
          echo "Using WASI_SYSROOT=${WASI_SYSROOT}"
          echo "Using CLANG=${CLANG}"

      - name: Install sccache
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) archive="sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" ;;
            aarch64|arm64) archive="sccache-${SCCACHE_VERSION}-aarch64-unknown-linux-musl.tar.gz" ;;
            *)
              echo "Unsupported architecture for sccache: $(uname -m)" >&2
              exit 1
              ;;
          esac
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/${archive}" -o "${tmpdir}/${archive}"
          tar -xzf "${tmpdir}/${archive}" -C "${tmpdir}"
          install -d "${CARGO_HOME}/bin"
          install -m 0755 "${tmpdir}"/sccache-*/sccache "${CARGO_HOME}/bin/sccache"
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
          sccache --version

      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Download xtask artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plugin-v3-xtask-${{ github.run_id }}
          path: xtask-artifact

      - name: Restore xtask binary
        run: |
          set -euo pipefail
          install -d xtask/target/xtask-release
          install -m 0755 xtask-artifact/xtask xtask/target/xtask-release/xtask

      - name: Verify release toolchain and Wasm tooling
        run: ./xtask/target/xtask-release/xtask doctor

      - name: Restore single-plugin release plan
        run: |
          set -euo pipefail
          printf '%s\t%s\n' "${{ matrix.plugin_id }}" "${{ matrix.version }}" > release-plan.tsv

      - name: Prefetch selected plugin dependencies
        run: |
          set -euo pipefail
          mapfile -t plugin_ids < <(cut -f1 release-plan.tsv | sort -u)
          ./xtask/target/xtask-release/xtask official prefetch "${plugin_ids[@]}"

      - name: Prepare sign and publish selected plugin v3 assets
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          while IFS=$'\t' read -r plugin_id version; do
            tag="plugins-v3/${plugin_id}/v${version}"
            prepared_dir="dist/prepared/${plugin_id}"

            ./xtask/target/xtask-release/xtask official prepare "${plugin_id}" \
              --version "${version}" \
              --out "${prepared_dir}" \
              --catalog-version v3

            ./xtask/target/xtask-release/xtask official verify-prepared "${prepared_dir}"

            "${SYFT_CMD}" "dir:${prepared_dir}" \
              --output "spdx-json=${prepared_dir}/scryer-plugin-${plugin_id}-${version}.spdx.json"

            find "${prepared_dir}" -maxdepth 1 -type f \( -name '*.wasm.zst' -o -name '*.wasm.br' \) \
              -printf '%f\n' | sort > "${prepared_dir}/v3-artifacts.txt"

            while IFS= read -r artifact_name; do
              [ -n "${artifact_name}" ] || continue
              cosign sign-blob \
                --yes \
                --bundle "${prepared_dir}/${artifact_name}.bundle" \
                "${prepared_dir}/${artifact_name}"
              cp "${prepared_dir}/${artifact_name}.bundle" \
                "${prepared_dir}/${artifact_name}.sigstore.json"
              zstd -19 -f "${prepared_dir}/${artifact_name}.bundle" -o "${prepared_dir}/${artifact_name}.bundle.zst"
              rm -f "${prepared_dir}/${artifact_name}.bundle"
            done < "${prepared_dir}/v3-artifacts.txt"

            release_assets=("${prepared_dir}/scryer-plugin-${plugin_id}-${version}.spdx.json")
            for asset in catalog-v3.json; do
              if [ -f "${prepared_dir}/${asset}" ]; then
                cosign sign-blob \
                  --yes \
                  --bundle "${prepared_dir}/${asset}.bundle" \
                  "${prepared_dir}/${asset}"
                cp "${prepared_dir}/${asset}.bundle" \
                  "${prepared_dir}/${asset}.sigstore.json"
                release_assets+=(
                  "${prepared_dir}/${asset}"
                  "${prepared_dir}/${asset}.bundle"
                  "${prepared_dir}/${asset}.sigstore.json"
                )
              fi
            done

            while IFS= read -r artifact_name; do
              [ -n "${artifact_name}" ] || continue
              release_assets+=(
                "${prepared_dir}/${artifact_name}"
                "${prepared_dir}/${artifact_name}.bundle.zst"
                "${prepared_dir}/${artifact_name}.sigstore.json"
              )
            done < "${prepared_dir}/v3-artifacts.txt"

            ./xtask/target/xtask-release/xtask official upload-r2 "${prepared_dir}"

            gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
              gh release create "${tag}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "${plugin_id} ${version}" \
                --target "$(git rev-parse HEAD)" \
                --notes "Scryer plugin distribution assets for the catalog-v3 lane."
            gh release upload "${tag}" \
              "${release_assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          done < release-plan.tsv

      - name: Stage prepared plugin artifacts
        run: |
          set -euo pipefail
          rm -rf prepared-plugins
          mkdir -p prepared-plugins
          cp -R "dist/prepared/${{ matrix.plugin_id }}" "prepared-plugins/${{ matrix.plugin_id }}"

      - name: Show sccache stats
        if: always()
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats | tee prepare-sccache-stats.txt
          else
            echo "sccache unavailable" | tee prepare-sccache-stats.txt
          fi

      - name: Upload prepared plugin artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plugin-v3-prepared-${{ github.run_id }}-${{ matrix.plugin_id }}
          path: prepared-plugins
          if-no-files-found: error
          retention-days: 7

      - name: Upload release stats
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plugin-v3-artifacts-${{ github.run_id }}-${{ matrix.plugin_id }}
          path: prepare-sccache-stats.txt
          if-no-files-found: error
          retention-days: 7

  collect-release-provenance-subjects:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.catalog_repair_specs == '' }}
    needs: [build-sign-release-plugin]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      subjects-file: ${{ steps.subjects.outputs.handle }}
    steps:
      - name: Download prepared release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-plugin-v3-prepared-${{ github.run_id }}-*
          path: release-artifacts
          merge-multiple: true

      - name: Create release subject list
        run: |
          set -euo pipefail
          find release-artifacts -type f \
            \( -name '*.wasm.zst' -o -name '*.wasm.br' -o -name '*.spdx.json' -o -name 'catalog-v3.json' \) \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum > release-subjects.sha256
          base64 -w0 release-subjects.sha256 > release-subjects.sha256.base64
          test -s release-subjects.sha256.base64

      - name: Share release subject list with the SLSA generator
        id: subjects
        uses: slsa-framework/slsa-github-generator/actions/generator/generic/create-base64-subjects-from-file@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
        with:
          path: release-subjects.sha256.base64

  generate-release-provenance:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.catalog_repair_specs == '' }}
    needs: [collect-release-provenance-subjects]
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects-as-file: ${{ needs.collect-release-provenance-subjects.outputs.subjects-file }}
      provenance-name: scryer-plugin-artifacts.intoto.jsonl
      compile-generator: true

  publish-release-provenance:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.catalog_repair_specs == '' }}
    needs: [plan-release, generate-release-provenance]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_MATRIX: ${{ needs.plan-release.outputs.plugin_matrix }}
      PROVENANCE_NAME: ${{ needs.generate-release-provenance.outputs.provenance-name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download signed SLSA provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.generate-release-provenance.outputs.provenance-name }}
          path: provenance

      - name: Attach provenance to every published plugin release
        run: |
          set -euo pipefail
          provenance_path="provenance/${PROVENANCE_NAME}"
          test -f "${provenance_path}"
          while IFS= read -r tag; do
            gh release upload "${tag}" "${provenance_path}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          done < <(printf '%s' "${RELEASE_MATRIX}" | jq -r '.include[] | "plugins-v3/\(.plugin_id)/v\(.version)"')

  publish-central-catalog:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.catalog_repair_specs == '' }}
    needs: [plan-release, build-sign-release-plugin, publish-release-provenance]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_R2_BUCKET_ID: ${{ vars.CF_R2_BUCKET_ID }}
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install central publish tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip zstd
          python3 -m pip install --user --require-hashes -r .github/awscli-requirements.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download xtask artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plugin-v3-xtask-${{ github.run_id }}
          path: xtask-artifact

      - name: Download release plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plugin-v3-plan-${{ github.run_id }}
          path: release-plan-artifact

      - name: Download prepared plugin artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-plugin-v3-prepared-${{ github.run_id }}-*
          path: prepared-plugins
          merge-multiple: true

      - name: Restore xtask binary
        run: |
          set -euo pipefail
          install -d xtask/target/xtask-release
          install -m 0755 xtask-artifact/xtask xtask/target/xtask-release/xtask

      - name: Restore full release plan
        run: |
          set -euo pipefail
          install -m 0644 release-plan-artifact/release-plan.tsv release-plan.tsv
          if [ ! -s release-plan.tsv ]; then
            echo "Release plan is empty" >&2
            exit 1
          fi

      - name: Verify prepared plugin artifacts
        run: |
          set -euo pipefail
          readonly parallelism=4
          declare -a active_pids=()
          failed=0

          wait_for_slot() {
            while (( ${#active_pids[@]} >= parallelism )); do
              if ! wait -n "${active_pids[@]}"; then
                failed=1
              fi
              local -a remaining=()
              local pid
              for pid in "${active_pids[@]}"; do
                if kill -0 "${pid}" 2>/dev/null; then
                  remaining+=("${pid}")
                fi
              done
              active_pids=("${remaining[@]}")
            done
          }

          while IFS= read -r plugin_id; do
            wait_for_slot
            if (( failed )); then
              break
            fi
            (
              echo "Verifying prepared artifacts for ${plugin_id}"
              ./xtask/target/xtask-release/xtask official verify-prepared "prepared-plugins/${plugin_id}"
            ) &
            active_pids+=("$!")
          done < <(cut -f1 release-plan.tsv | sort -u)

          for pid in "${active_pids[@]}"; do
            if ! wait "${pid}"; then
              failed=1
            fi
          done
          (( ! failed ))

      - name: Prepare sign and publish central catalog v3
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t plugin_ids < <(cut -f1 release-plan.tsv | sort -u)
          prepare_v3_args=(
            --out dist/catalog-v3
            --prepared-plugin-root prepared-plugins
          )
          existing_dir="existing-central-catalog-v3"
          mkdir -p "${existing_dir}"
          gh release download "catalog/v3" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern catalog-v3.redirect.json \
            --pattern catalog-v3.redirect.bundle.json \
            --dir "${existing_dir}" \
            --clobber
          identity_regexp="^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/release-plugin(-v3)?\\.yml@refs/(tags|heads)/.*$"
          cosign verify-blob \
            --bundle "${existing_dir}/catalog-v3.redirect.bundle.json" \
            --certificate-identity-regexp "${identity_regexp}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${existing_dir}/catalog-v3.redirect.json"
          catalog_asset="$(python3 -c 'import json, sys; from pathlib import Path; redirect = json.loads(Path("existing-central-catalog-v3/catalog-v3.redirect.json").read_text()); artifacts = redirect.get("artifacts") or []; sys.exit("catalog-v3 redirect does not contain any artifacts") if not artifacts else None; print(artifacts[-1]["url"].rsplit("/", 1)[-1])')"
          gh release download "catalog/v3" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${catalog_asset}" \
            --pattern "${catalog_asset}.bundle.zst" \
            --dir "${existing_dir}" \
            --clobber
          zstd -dc "${existing_dir}/${catalog_asset}.bundle.zst" > "${existing_dir}/${catalog_asset}.bundle"
          cosign verify-blob \
            --bundle "${existing_dir}/${catalog_asset}.bundle" \
            --certificate-identity-regexp "${identity_regexp}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${existing_dir}/${catalog_asset}"
          prepare_v3_args+=(--existing-catalog "${existing_dir}/${catalog_asset}")
          for plugin_id in "${plugin_ids[@]}"; do
            prepare_v3_args+=(--plugin-id "${plugin_id}")
          done
          ./xtask/target/xtask-release/xtask catalog prepare-v3 "${prepare_v3_args[@]}"
          for asset in catalog-v3.min.json.zst; do
            cosign sign-blob \
              --yes \
              --bundle "dist/catalog-v3/${asset}.bundle" \
              "dist/catalog-v3/${asset}"
          done
          cosign sign-blob \
            --yes \
            --bundle "dist/catalog-v3/catalog-v3.redirect.bundle.json" \
            "dist/catalog-v3/catalog-v3.redirect.json"
          cp "dist/catalog-v3/catalog-v3.redirect.bundle.json" \
            "dist/catalog-v3/catalog-v3.redirect.sigstore.json"

          python3 -c 'import json; from pathlib import Path; root = Path("dist/catalog-v3"); redirect = json.loads((root / "catalog-v3.redirect.json").read_text()); catalog_assets = [artifact["url"].rsplit("/", 1)[-1] for artifact in redirect["artifacts"]]; catalog = json.loads((root / "catalog-v3.json").read_text()); rule_pack_assets = sorted({artifact["url"].rsplit("/", 1)[-1] for rule_pack in catalog["rule_packs"] for release in rule_pack["releases"] for artifact in release["artifacts"]}); print("\n".join(catalog_assets + rule_pack_assets))' > dist/catalog-v3/v3-central-assets.txt

          while IFS= read -r asset_name; do
            [ -n "${asset_name}" ] || continue
            cosign sign-blob \
              --yes \
              --bundle "dist/catalog-v3/${asset_name}.bundle" \
              "dist/catalog-v3/${asset_name}"
            cp "dist/catalog-v3/${asset_name}.bundle" \
              "dist/catalog-v3/${asset_name}.sigstore.json"
            zstd -19 -f "dist/catalog-v3/${asset_name}.bundle" -o "dist/catalog-v3/${asset_name}.bundle.zst"
            rm -f "dist/catalog-v3/${asset_name}.bundle"
          done < dist/catalog-v3/v3-central-assets.txt

          ./xtask/target/xtask-release/xtask catalog upload-v3r2 dist/catalog-v3

          gh release view "catalog/v3" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "catalog/v3" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Scryer plugin central catalog v3" \
              --target "$(git rev-parse HEAD)" \
              --notes "Scryer plugin central catalog v3 assets."
          central_release_assets=(
            "dist/catalog-v3/catalog-v3.redirect.json"
            "dist/catalog-v3/catalog-v3.redirect.bundle.json"
            "dist/catalog-v3/catalog-v3.redirect.sigstore.json"
          )
          while IFS= read -r asset_name; do
            [ -n "${asset_name}" ] || continue
            central_release_assets+=(
              "dist/catalog-v3/${asset_name}"
              "dist/catalog-v3/${asset_name}.bundle.zst"
              "dist/catalog-v3/${asset_name}.sigstore.json"
            )
          done < dist/catalog-v3/v3-central-assets.txt
          gh release upload "catalog/v3" \
            "${central_release_assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  repair-central-catalog:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.catalog_repair_specs != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_R2_BUCKET_ID: ${{ vars.CF_R2_BUCKET_ID }}
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install central repair tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip zstd
          python3 -m pip install --user --require-hashes -r .github/awscli-requirements.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build xtask
        run: cargo build --locked --profile xtask-release --manifest-path xtask/Cargo.toml --bin xtask

      - name: Parse catalog repair specs
        run: |
          set -euo pipefail
          specs="${{ inputs.catalog_repair_specs }}"
          : > repair-plan.tsv
          printf '%s\n' "${specs}" \
            | tr ',[:space:]' '\n' \
            | awk 'NF' \
            | while IFS= read -r spec; do
                case "${spec}" in
                  *@*)
                    plugin_id="${spec%@*}"
                    version="${spec#*@}"
                    ;;
                  *)
                    echo "Invalid repair spec '${spec}'; expected plugin_id@version" >&2
                    exit 1
                    ;;
                esac
                if [ -z "${plugin_id}" ] || [ -z "${version}" ]; then
                  echo "Invalid repair spec '${spec}'; expected plugin_id@version" >&2
                  exit 1
                fi
                printf '%s\t%s\n' "${plugin_id}" "${version}" >> repair-plan.tsv
              done
          if [ ! -s repair-plan.tsv ]; then
            echo "No catalog repair specs were provided" >&2
            exit 1
          fi
          sort -u repair-plan.tsv -o repair-plan.tsv
          printf 'Catalog repair plan\n'
          while IFS=$'\t' read -r plugin_id version; do
            printf ' - %s %s\n' "${plugin_id}" "${version}"
          done < repair-plan.tsv

      - name: Download and verify current central catalog
        run: |
          set -euo pipefail
          existing_dir="existing-central-catalog-v3"
          mkdir -p "${existing_dir}"
          gh release download "catalog/v3" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern catalog-v3.redirect.json \
            --pattern catalog-v3.redirect.bundle.json \
            --dir "${existing_dir}" \
            --clobber
          identity_regexp="^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/release-plugin(-v3)?\\.yml@refs/(tags|heads)/.*$"
          cosign verify-blob \
            --bundle "${existing_dir}/catalog-v3.redirect.bundle.json" \
            --certificate-identity-regexp "${identity_regexp}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${existing_dir}/catalog-v3.redirect.json"
          catalog_asset="$(python3 -c 'import json, sys; from pathlib import Path; redirect = json.loads(Path("existing-central-catalog-v3/catalog-v3.redirect.json").read_text()); artifacts = redirect.get("artifacts") or []; sys.exit("catalog-v3 redirect does not contain any artifacts") if not artifacts else None; print(artifacts[-1]["url"].rsplit("/", 1)[-1])')"
          gh release download "catalog/v3" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${catalog_asset}" \
            --pattern "${catalog_asset}.bundle.zst" \
            --dir "${existing_dir}" \
            --clobber
          zstd -dc "${existing_dir}/${catalog_asset}.bundle.zst" > "${existing_dir}/${catalog_asset}.bundle"
          cosign verify-blob \
            --bundle "${existing_dir}/${catalog_asset}.bundle" \
            --certificate-identity-regexp "${identity_regexp}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${existing_dir}/${catalog_asset}"
          echo "catalog_asset=${catalog_asset}" >> "$GITHUB_ENV"

      - name: Download and verify historical plugin snippets
        run: |
          set -euo pipefail
          snippets_root="repair-snippets"
          mkdir -p "${snippets_root}"
          identity_regexp="^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/release-plugin(-v3)?\\.yml@refs/(tags|heads)/.*$"
          while IFS=$'\t' read -r plugin_id version; do
            tag="plugins-v3/${plugin_id}/v${version}"
            plugin_dir="${snippets_root}/${plugin_id}"
            tmp_dir="downloaded-snippets/${plugin_id}-${version}"
            mkdir -p "${plugin_dir}" "${tmp_dir}"
            gh release download "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern catalog-v3.json \
              --pattern catalog-v3.json.bundle \
              --dir "${tmp_dir}" \
              --clobber
            cosign verify-blob \
              --bundle "${tmp_dir}/catalog-v3.json.bundle" \
              --certificate-identity-regexp "${identity_regexp}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${tmp_dir}/catalog-v3.json"
            python3 -c 'import json, sys; from pathlib import Path; plugin_id, version, snippet_path = sys.argv[1:]; snippet = json.loads(Path(snippet_path).read_text()); releases = snippet.get("releases") or []; sys.exit("snippet id {} does not match {}".format(snippet.get("id"), plugin_id)) if snippet.get("id") != plugin_id else None; sys.exit("snippet {} does not contain release {}".format(plugin_id, version)) if not any(release.get("version") == version for release in releases) else None' "${plugin_id}" "${version}" "${tmp_dir}/catalog-v3.json"
            install -m 0644 "${tmp_dir}/catalog-v3.json" "${plugin_dir}/catalog-v3.json"
          done < repair-plan.tsv

      - name: Prepare sign and publish repaired central catalog
        run: |
          set -euo pipefail
          mapfile -t plugin_ids < <(cut -f1 repair-plan.tsv | sort -u)
          prepare_v3_args=(
            --out dist/catalog-v3
            --existing-catalog "existing-central-catalog-v3/${catalog_asset}"
            --prepared-plugin-root repair-snippets
          )
          for plugin_id in "${plugin_ids[@]}"; do
            prepare_v3_args+=(--plugin-id "${plugin_id}")
          done
          ./xtask/target/xtask-release/xtask catalog prepare-v3 "${prepare_v3_args[@]}"

          cosign sign-blob \
            --yes \
            --bundle "dist/catalog-v3/catalog-v3.min.json.zst.bundle" \
            "dist/catalog-v3/catalog-v3.min.json.zst"
          cosign sign-blob \
            --yes \
            --bundle "dist/catalog-v3/catalog-v3.redirect.bundle.json" \
            "dist/catalog-v3/catalog-v3.redirect.json"

          python3 -c 'import json; from pathlib import Path; root = Path("dist/catalog-v3"); redirect = json.loads((root / "catalog-v3.redirect.json").read_text()); catalog_assets = [artifact["url"].rsplit("/", 1)[-1] for artifact in redirect["artifacts"]]; catalog = json.loads((root / "catalog-v3.json").read_text()); rule_pack_assets = sorted({artifact["url"].rsplit("/", 1)[-1] for rule_pack in catalog["rule_packs"] for release in rule_pack["releases"] for artifact in release["artifacts"]}); print("\n".join(catalog_assets + rule_pack_assets))' > dist/catalog-v3/v3-central-assets.txt

          while IFS= read -r asset_name; do
            [ -n "${asset_name}" ] || continue
            cosign sign-blob \
              --yes \
              --bundle "dist/catalog-v3/${asset_name}.bundle" \
              "dist/catalog-v3/${asset_name}"
            zstd -19 -f "dist/catalog-v3/${asset_name}.bundle" -o "dist/catalog-v3/${asset_name}.bundle.zst"
            rm -f "dist/catalog-v3/${asset_name}.bundle"
          done < dist/catalog-v3/v3-central-assets.txt

          ./xtask/target/xtask-release/xtask catalog upload-v3r2 dist/catalog-v3

          central_release_assets=(
            "dist/catalog-v3/catalog-v3.redirect.json"
            "dist/catalog-v3/catalog-v3.redirect.bundle.json"
          )
          while IFS= read -r asset_name; do
            [ -n "${asset_name}" ] || continue
            central_release_assets+=(
              "dist/catalog-v3/${asset_name}"
              "dist/catalog-v3/${asset_name}.bundle.zst"
            )
          done < dist/catalog-v3/v3-central-assets.txt
          gh release upload "catalog/v3" \
            "${central_release_assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
