name: release-plugin-v3

on:
  push:
    tags:
      - "plugins-v3/release/*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Release tag or commit to inspect (manual runs never publish)"
        required: true
        type: string
      release_commit:
        description: "Commit that owns the plugin version tags to inspect"
        required: false
        type: string
      plugin_ids:
        description: "Whitespace or comma separated plugin ids to inspect from current manifests"
        required: false
        type: string
      rule_pack_ids:
        description: "Whitespace or comma separated rule-pack ids to inspect from current manifests"
        required: false
        type: string
      catalog_repair_specs:
        description: "Catalog repair diagnostics formatted as plugin_id@version; never publishes"
        required: false
        type: string

permissions: read-all

env:
  RELEASE_PLUGIN_CACHE_SCOPE: release-plugin-v3
  RELEASE_PLUGIN_PLAN_SCCACHE_LANE: linux-host-xtask
  RELEASE_PLUGIN_PLAN_SCCACHE_BUILD_FLAVOR: xtask-release
  RELEASE_PLUGIN_BUILD_SCCACHE_LANE: linux-wasm32-wasip2-plugin-release
  RELEASE_PLUGIN_BUILD_SCCACHE_BUILD_FLAVOR: plugin-release
  SCCACHE_VERSION: v0.10.0
  WASI_SDK_VERSION: "33.0"
  WASI_SDK_RELEASE_TAG: wasi-sdk-33
  WASM_TOOLS_VERSION: "1.253.0"
  CF_JURISDICTION_URL: ${{ secrets.CF_JURISDICTION_URL }}
  CF_R2_PUBLIC_BASE_URL: https://cdn.scryer.media/scryer
  SCRYER_OFFICIAL_RELEASE_WORKFLOW_PATH: .github/workflows/release-plugin-v3.yml
  SCRYER_OFFICIAL_PLUGIN_RELEASE_TAG_PREFIX: plugins-v3
  SCRYER_CATALOG_V3_RELEASE_TAG: catalog/v3
  SCRYER_CATALOG_V3_PATH_PREFIX: catalog/v3
  # Reuse the operator-signed publication trigger; never create tags via the release API.
  SCRYER_CATALOG_V3_GENERATION_RELEASE_TAG: ${{ github.ref_name }}

jobs:
  plan-release:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.catalog_repair_specs == '' }}
    outputs:
      plugin_matrix: ${{ steps.plugin-plans.outputs.plugin_matrix }}
      rule_pack_matrix: ${{ steps.plugin-plans.outputs.rule_pack_matrix }}
      has_plugins: ${{ steps.plugin-plans.outputs.has_plugins }}
      has_rule_packs: ${{ steps.plugin-plans.outputs.has_rule_packs }}
      catalog_only: ${{ steps.release-source.outputs.catalog_only }}
    runs-on: ubuntu-latest
    env:
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ github.token }}
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: /home/runner/work/scryer-plugins/scryer-plugins
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: gha-rust-cache-linux-${{ env.RELEASE_PLUGIN_CACHE_SCOPE }}-xtask
          workspaces: |
            xtask -> xtask/target
          cache-targets: "false"
          cache-workspace-crates: "false"
          key: xtask-release

      - name: Restore sccache directory
        id: validate-sccache-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/sccache
          key: gha-sccache-v2-${{ env.RELEASE_PLUGIN_CACHE_SCOPE }}-${{ env.RELEASE_PLUGIN_PLAN_SCCACHE_LANE }}-${{ env.RELEASE_PLUGIN_PLAN_SCCACHE_BUILD_FLAVOR }}-${{ github.run_id }}
          restore-keys: |
            gha-sccache-v2-${{ env.RELEASE_PLUGIN_CACHE_SCOPE }}-${{ env.RELEASE_PLUGIN_PLAN_SCCACHE_LANE }}-${{ env.RELEASE_PLUGIN_PLAN_SCCACHE_BUILD_FLAVOR }}-
            gha-sccache-v2-${{ env.RELEASE_PLUGIN_CACHE_SCOPE }}-${{ env.RELEASE_PLUGIN_PLAN_SCCACHE_LANE }}-

      - name: Install sccache
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) archive="sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" ;;
            aarch64|arm64) archive="sccache-${SCCACHE_VERSION}-aarch64-unknown-linux-musl.tar.gz" ;;
            *)
              echo "Unsupported architecture for sccache: $(uname -m)" >&2
              exit 1
              ;;
          esac
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/${archive}" -o "${tmpdir}/${archive}"
          tar -xzf "${tmpdir}/${archive}" -C "${tmpdir}"
          install -d "${CARGO_HOME}/bin"
          install -m 0755 "${tmpdir}"/sccache-*/sccache "${CARGO_HOME}/bin/sccache"
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
          sccache --version

      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Build xtask once
        run: cargo build --locked --profile xtask-release --manifest-path xtask/Cargo.toml --bin xtask

      - name: Select component release plan
        id: release-source
        run: |
          set -euo pipefail
          # A `plugins-v3/release/catalog-<suffix>-from-<sha>` trigger republishes the
          # central catalog from component releases that already exist; it rebuilds and
          # re-signs nothing, so every build and provenance job gates itself off below.
          readonly catalog_only_prefix="refs/tags/plugins-v3/release/catalog-"
          catalog_only=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [[ "${GITHUB_REF}" == "${catalog_only_prefix}"* ]]; then
            catalog_only=true
          fi
          printf 'catalog_only=%s\n' "${catalog_only}" >> "${GITHUB_OUTPUT}"
          PLUGIN_IDS_INPUT="${{ github.event_name == 'workflow_dispatch' && inputs.plugin_ids || '' }}"
          RULE_PACK_IDS_INPUT="${{ github.event_name == 'workflow_dispatch' && inputs.rule_pack_ids || '' }}"
          : > release-plugin-plan.tsv
          : > release-rule-pack-plan.tsv

          append_rule_pack() {
            local rule_pack_id="$1"
            local asset version
            asset="$(jq -r --arg id "${rule_pack_id}" '.rule_packs[] | select(.id == $id) | .asset' rule_packs/manifest.json)"
            if [ -z "${asset}" ] || [ "${asset}" = "null" ] || [[ "${asset}" == */* ]]; then
              echo "Unknown or unsafe rule pack id ${rule_pack_id}" >&2
              return 1
            fi
            version="$(jq -r '.version' "rule_packs/${asset}")"
            if [ -z "${version}" ] || [ "${version}" = "null" ]; then
              echo "Rule pack ${rule_pack_id} has no manifest version" >&2
              return 1
            fi
            printf '%s\t%s\n' "${rule_pack_id}" "${version}" >> release-rule-pack-plan.tsv
          }

          if [ -n "${PLUGIN_IDS_INPUT//[[:space:],]/}" ] || [ -n "${RULE_PACK_IDS_INPUT//[[:space:],]/}" ]; then
            if [ -n "${PLUGIN_IDS_INPUT//[[:space:],]/}" ]; then
              mapfile -t plugin_ids < <(printf '%s\n' "${PLUGIN_IDS_INPUT}" | tr ',[:space:]' '\n' | awk 'NF')
              if (( ${#plugin_ids[@]} == 0 )); then
                echo "No plugin ids were provided" >&2
                exit 1
              fi
              ./xtask/target/xtask-release/xtask official plan-current "${plugin_ids[@]}" \
                | awk -v commit="$(git rev-parse HEAD)" 'BEGIN { OFS = "\t" } NF { print $1, $2, commit }' > release-plugin-plan.tsv
            fi
            if [ -n "${RULE_PACK_IDS_INPUT//[[:space:],]/}" ]; then
              mapfile -t rule_pack_ids < <(printf '%s\n' "${RULE_PACK_IDS_INPUT}" | tr ',[:space:]' '\n' | awk 'NF' | sort -u)
              if (( ${#rule_pack_ids[@]} == 0 )); then
                echo "No rule-pack ids were provided" >&2
                exit 1
              fi
              for rule_pack_id in "${rule_pack_ids[@]}"; do
                append_rule_pack "${rule_pack_id}"
              done
            fi
          else
            if [ "${catalog_only}" = "true" ]; then
              source_short_sha="${GITHUB_REF##*-from-}"
              if [[ ! "${source_short_sha}" =~ ^[0-9a-f]{12}$ ]]; then
                echo "Catalog-only trigger does not carry a valid source commit: ${GITHUB_REF}" >&2
                exit 1
              fi
              RELEASE_SHA="$(git rev-parse --verify "${source_short_sha}^{commit}")"
              git merge-base --is-ancestor "${RELEASE_SHA}" HEAD
              printf 'Catalog-only release uses component tags at %s\n' "${RELEASE_SHA}"
            else
              RELEASE_SHA="${{ github.event_name == 'workflow_dispatch' && inputs.release_commit || '' }}"
            fi
            if [ -z "${RELEASE_SHA:-}" ]; then RELEASE_SHA="$(git rev-parse HEAD)"; fi
            # A pushed trigger lists its plugin components (tag and source
            # commit) in its signed body and nothing else is built from it.
            # Catalog-only and manual runs take the plugin tags at the release
            # commit plus the components that triggers created there list.
            # On a push the trigger and every component tag must also be
            # GitHub-verified signatures.
            trigger_tag=""
            verify_components=false
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              verify_components=true
              if [ "${catalog_only}" != "true" ]; then
                trigger_tag="${GITHUB_REF_NAME}"
              fi
            fi
            source .github/scripts/release-plugin-v3-components.sh
            release_plugin_components "${trigger_tag}" "${RELEASE_SHA}" "${GITHUB_REPOSITORY}" "${verify_components}" >> release-plugin-plan.tsv
            mapfile -t rule_pack_tags < <(git tag --points-at "${RELEASE_SHA}" | sort | grep -E '^rule-packs/[^/]+/v.+$' || true)
            if [ "${catalog_only}" = "true" ] && (( ${#rule_pack_tags[@]} > 0 )); then
              echo "Catalog-only release covers plugin components only, but ${RELEASE_SHA} also carries rule-pack tags: ${rule_pack_tags[*]}" >&2
              exit 1
            fi
            for tag in "${rule_pack_tags[@]}"; do
              rule_pack_spec="${tag#rule-packs/}"
              rule_pack_id="${rule_pack_spec%/v*}"
              tag_version="${tag##*/v}"
              append_rule_pack "${rule_pack_id}"
              asset="$(jq -r --arg id "${rule_pack_id}" '.rule_packs[] | select(.id == $id) | .asset' rule_packs/manifest.json)"
              go run .github/scripts/release_workflow_plan.go --check-rule-pack-version --rule-pack-id "${rule_pack_id}" --tag-version "${tag_version}" --manifest "rule_packs/${asset}"
            done
          fi
          sort -u release-plugin-plan.tsv -o release-plugin-plan.tsv
          sort -u release-rule-pack-plan.tsv -o release-rule-pack-plan.tsv
          if [ ! -s release-plugin-plan.tsv ] && [ ! -s release-rule-pack-plan.tsv ]; then
            echo "No plugin or rule-pack release tags point at the selected commit" >&2
            exit 1
          fi

      - name: Build component release matrices
        id: plugin-plans
        run: |
          set -euo pipefail
          go run .github/scripts/release_workflow_plan.go --plugin-plan release-plugin-plan.tsv --rule-pack-plan release-rule-pack-plan.tsv --github-output "${GITHUB_OUTPUT}"

      - name: Show sccache stats
        if: always()
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats | tee validate-sccache-stats.txt
          else
            echo "sccache unavailable" | tee validate-sccache-stats.txt
          fi

      - name: Upload xtask artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plugin-v3-xtask-${{ github.run_id }}
          path: xtask/target/xtask-release/xtask
          if-no-files-found: error
          retention-days: 90  # a rerun that restores the saved signed preparation needs these too

      - name: Upload release plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plugin-v3-plan-${{ github.run_id }}
          path: |
            release-plugin-plan.tsv
            release-rule-pack-plan.tsv
          if-no-files-found: error
          retention-days: 90  # a rerun that restores the saved signed preparation needs these too

      - name: Upload validate stats
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plugin-v3-validate-${{ github.run_id }}
          path: validate-sccache-stats.txt
          if-no-files-found: error
          retention-days: 7

  build-sign-release-plugin:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugins-v3/release/') && needs.plan-release.outputs.has_plugins == 'true' && needs.plan-release.outputs.catalog_only != 'true' }}
    needs: [plan-release]
    name: validate-build-sign-release (${{ matrix.plugin_id }} ${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-release.outputs.plugin_matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_R2_BUCKET_ID: ${{ vars.CF_R2_BUCKET_ID }}
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      GH_TOKEN: ${{ github.token }}
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: /home/runner/work/scryer-plugins/scryer-plugins
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require release trigger tag
        run: |
          source .github/scripts/release-plugin-v3-identity.sh
          require_release_publish_context "${GITHUB_EVENT_NAME}" "${GITHUB_REF}"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: gha-rust-cache-linux-${{ env.RELEASE_PLUGIN_CACHE_SCOPE }}-plugin-build
          workspaces: |
            xtask -> xtask/target
            download_clients/qbittorrent -> download_clients/qbittorrent/target
            indexers/newznab -> indexers/newznab/target
            indexers/torrent-rss -> indexers/torrent-rss/target
            indexers/torznab -> indexers/torznab/target
            notifications/email -> notifications/email/target
            notifications/jellyfin -> notifications/jellyfin/target
            notifications/webhook -> notifications/webhook/target
            subtitles/jimaku -> subtitles/jimaku/target
            subtitles/opensubtitles -> subtitles/opensubtitles/target
            subtitles/subdl -> subtitles/subdl/target
            subtitles/enhanced-sync -> subtitles/enhanced-sync/target
          cache-targets: "false"
          cache-workspace-crates: "false"
          key: plugin-release

      - name: Restore sccache directory
        id: prepare-sccache-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/sccache
          key: gha-sccache-v2-${{ env.RELEASE_PLUGIN_CACHE_SCOPE }}-${{ env.RELEASE_PLUGIN_BUILD_SCCACHE_LANE }}-${{ env.RELEASE_PLUGIN_BUILD_SCCACHE_BUILD_FLAVOR }}-${{ matrix.plugin_id }}-${{ matrix.version }}-${{ github.run_id }}
          restore-keys: |
            gha-sccache-v2-${{ env.RELEASE_PLUGIN_CACHE_SCOPE }}-${{ env.RELEASE_PLUGIN_BUILD_SCCACHE_LANE }}-${{ env.RELEASE_PLUGIN_BUILD_SCCACHE_BUILD_FLAVOR }}-
            gha-sccache-v2-${{ env.RELEASE_PLUGIN_CACHE_SCOPE }}-${{ env.RELEASE_PLUGIN_BUILD_SCCACHE_LANE }}-

      - name: Install release tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pip zstd
          python3 -m pip install --user --require-hashes -r .github/awscli-requirements.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          case "$(uname -m)" in
            x86_64)
              wasm_tools_archive="wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz"
              wasm_tools_sha256="4e2898f7ca3bd0536218ed9b7b36ff7b86954c57ae0e6272fde69728cbe01088"
              ;;
            aarch64|arm64)
              wasm_tools_archive="wasm-tools-${WASM_TOOLS_VERSION}-aarch64-linux.tar.gz"
              wasm_tools_sha256="4a9a1c6a0885aaf17f433f2927bd61b1fe40069836f750f4e9f9ccd661106c65"
              ;;
            *)
              echo "Unsupported architecture for wasm-tools: $(uname -m)" >&2
              exit 1
              ;;
          esac
          wasi_sdk_archive="wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          wasm_tools_url="https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/${wasm_tools_archive}"
          wasi_sdk_url="https://github.com/WebAssembly/wasi-sdk/releases/download/${WASI_SDK_RELEASE_TAG}/${wasi_sdk_archive}"
          tmpdir="$(mktemp -d)"
          curl -fsSL "$wasm_tools_url" -o "$tmpdir/$wasm_tools_archive"
          curl -fsSL "$wasi_sdk_url" -o "$tmpdir/$wasi_sdk_archive"
          printf '%s  %s\n' "$wasm_tools_sha256" "$tmpdir/$wasm_tools_archive" | sha256sum --check --strict
          tar -xzf "$tmpdir/$wasm_tools_archive" -C "$tmpdir"
          sudo install -m 0755 "$tmpdir"/wasm-tools-*/wasm-tools /usr/local/bin/wasm-tools
          wasm-tools --version
          wasi_sdk_root="${RUNNER_TEMP}/wasi-sdk-${WASI_SDK_VERSION}"
          rm -rf "$wasi_sdk_root"
          mkdir -p "$wasi_sdk_root"
          tar -xzf "$tmpdir/$wasi_sdk_archive" -C "$wasi_sdk_root" --strip-components=1
          if [ ! -d "$wasi_sdk_root/bin" ] || [ ! -d "$wasi_sdk_root/share/wasi-sysroot" ]; then
            echo "failed to extract wasi-sdk root" >&2
            exit 1
          fi
          {
            echo "$wasi_sdk_root/bin"
          } >> "$GITHUB_PATH"
          {
            echo "WASI_SYSROOT=$wasi_sdk_root/share/wasi-sysroot"
            echo "FFMPEG_WASI_SYSROOT=$wasi_sdk_root/share/wasi-sysroot"
            echo "CLANG=$wasi_sdk_root/bin/clang"
            echo "LLVM_AR=$wasi_sdk_root/bin/llvm-ar"
            echo "LLVM_NM=$wasi_sdk_root/bin/llvm-nm"
            echo "LLVM_RANLIB=$wasi_sdk_root/bin/llvm-ranlib"
            echo "LLVM_STRIP=$wasi_sdk_root/bin/llvm-strip"
          } >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Validate WASI sysroot
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WASI_SYSROOT:-}" ] || [ ! -d "${WASI_SYSROOT}" ]; then
            echo "WASI sysroot not found after installing wasi-sdk" >&2
            exit 1
          fi
          if [ -z "${CLANG:-}" ] || [ ! -x "${CLANG}" ]; then
            echo "WASI clang not found after installing wasi-sdk" >&2
            exit 1
          fi
          echo "Using WASI_SYSROOT=${WASI_SYSROOT}"
          echo "Using CLANG=${CLANG}"

      - name: Install sccache
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) archive="sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" ;;
            aarch64|arm64) archive="sccache-${SCCACHE_VERSION}-aarch64-unknown-linux-musl.tar.gz" ;;
            *)
              echo "Unsupported architecture for sccache: $(uname -m)" >&2
              exit 1
              ;;
          esac
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/${archive}" -o "${tmpdir}/${archive}"
          tar -xzf "${tmpdir}/${archive}" -C "${tmpdir}"
          install -d "${CARGO_HOME}/bin"
          install -m 0755 "${tmpdir}"/sccache-*/sccache "${CARGO_HOME}/bin/sccache"
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
          sccache --version

      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Download xtask artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plugin-v3-xtask-${{ github.run_id }}
          path: xtask-artifact

      - name: Restore xtask binary
        run: |
          set -euo pipefail
          install -d xtask/target/xtask-release
          install -m 0755 xtask-artifact/xtask xtask/target/xtask-release/xtask

      # The plugin is built from the commit its component tag names, which the
      # plan job verified is a signed ancestor of the trigger. A component from
      # an earlier commit is built from a detached worktree of that commit (its
      # own Cargo.lock and SDK) by the trigger's xtask, so an older line never
      # goes through an older release pipeline.
      - name: Select release source
        env:
          SOURCE_COMMIT: ${{ matrix.source_commit }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Matrix entry carries an invalid source commit: ${SOURCE_COMMIT}" >&2
            exit 1
          fi
          if [ "${SOURCE_COMMIT}" = "$(git rev-parse HEAD)" ]; then
            echo "Building from the trigger commit ${SOURCE_COMMIT}"
            exit 0
          fi
          git merge-base --is-ancestor "${SOURCE_COMMIT}" HEAD
          source_root="${RUNNER_TEMP}/release-source"
          git worktree add --detach "${source_root}" "${SOURCE_COMMIT}"
          # The source commit may pin a different toolchain than the trigger
          # commit the stable step installed. `xtask doctor` and the build run
          # against the worktree's rust-toolchain.toml, so install that
          # channel with the Wasm target before either runs.
          if [ -f "${source_root}/rust-toolchain.toml" ]; then
            channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "${source_root}/rust-toolchain.toml" | head -n 1)"
            if [ -z "${channel}" ]; then
              echo "${source_root}/rust-toolchain.toml does not name a channel" >&2
              exit 1
            fi
            rustup toolchain install "${channel}" --profile minimal --target wasm32-wasip2 --no-self-update
          fi
          echo "Building from ${SOURCE_COMMIT} checked out at ${source_root}"
          echo "SCRYER_PLUGIN_RELEASE_SOURCE_ROOT=${source_root}" >> "${GITHUB_ENV}"

      - name: Verify release toolchain and Wasm tooling
        run: ./xtask/target/xtask-release/xtask doctor

      - name: Restore single-plugin release plan
        env:
          SOURCE_COMMIT: ${{ matrix.source_commit }}
        run: |
          set -euo pipefail
          printf '%s\t%s\t%s\n' "${{ matrix.plugin_id }}" "${{ matrix.version }}" "${SOURCE_COMMIT}" > release-plan.tsv

      - name: Prefetch selected plugin dependencies
        run: |
          set -euo pipefail
          mapfile -t plugin_ids < <(cut -f1 release-plan.tsv | sort -u)
          ./xtask/target/xtask-release/xtask official prefetch "${plugin_ids[@]}"

      - name: Prepare sign and publish selected plugin v3 assets
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          source .github/scripts/release-plugin-v3-identity.sh
          require_release_publish_context "${GITHUB_EVENT_NAME}" "${GITHUB_REF}"
          while IFS=$'\t' read -r plugin_id version source_commit; do
            tag="plugins-v3/${plugin_id}/v${version}"
            prepared_dir="dist/prepared/${plugin_id}/${version}"

            ./xtask/target/xtask-release/xtask official prepare "${plugin_id}" \
              --version "${version}" \
              --out "${prepared_dir}" \
              --catalog-version v3

            ./xtask/target/xtask-release/xtask official verify-prepared "${prepared_dir}"

            "${SYFT_CMD}" "dir:${prepared_dir}" \
              --output "spdx-json=${prepared_dir}/scryer-plugin-${plugin_id}-${version}.spdx.json"

            find "${prepared_dir}" -maxdepth 1 -type f \( -name '*.wasm.zst' -o -name '*.wasm.br' \) \
              -printf '%f\n' | sort > "${prepared_dir}/v3-artifacts.txt"

            while IFS= read -r artifact_name; do
              [ -n "${artifact_name}" ] || continue
              cosign sign-blob \
                --yes \
                --bundle "${prepared_dir}/${artifact_name}.bundle" \
                "${prepared_dir}/${artifact_name}"
              verify_release_blob \
                "${prepared_dir}/${artifact_name}" \
                "${prepared_dir}/${artifact_name}.bundle" \
                "${GITHUB_REPOSITORY}" \
                "${GITHUB_REF}"
              cp "${prepared_dir}/${artifact_name}.bundle" \
                "${prepared_dir}/${artifact_name}.sigstore.json"
              zstd -19 -f "${prepared_dir}/${artifact_name}.bundle" -o "${prepared_dir}/${artifact_name}.bundle.zst"
              rm -f "${prepared_dir}/${artifact_name}.bundle"
            done < "${prepared_dir}/v3-artifacts.txt"

            release_assets=("${prepared_dir}/scryer-plugin-${plugin_id}-${version}.spdx.json")
            for asset in catalog-v3.json; do
              if [ -f "${prepared_dir}/${asset}" ]; then
                cosign sign-blob \
                  --yes \
                  --bundle "${prepared_dir}/${asset}.bundle" \
                  "${prepared_dir}/${asset}"
                verify_release_blob \
                  "${prepared_dir}/${asset}" \
                  "${prepared_dir}/${asset}.bundle" \
                  "${GITHUB_REPOSITORY}" \
                  "${GITHUB_REF}"
                cp "${prepared_dir}/${asset}.bundle" \
                  "${prepared_dir}/${asset}.sigstore.json"
                release_assets+=(
                  "${prepared_dir}/${asset}"
                  "${prepared_dir}/${asset}.bundle"
                  "${prepared_dir}/${asset}.sigstore.json"
                )
              fi
            done

            while IFS= read -r artifact_name; do
              [ -n "${artifact_name}" ] || continue
              release_assets+=(
                "${prepared_dir}/${artifact_name}"
                "${prepared_dir}/${artifact_name}.bundle.zst"
                "${prepared_dir}/${artifact_name}.sigstore.json"
              )
            done < "${prepared_dir}/v3-artifacts.txt"

            ./xtask/target/xtask-release/xtask official upload-r2 "${prepared_dir}"

            gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
              gh release create "${tag}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "${plugin_id} ${version}" \
                --target "${source_commit}" \
                --notes "Scryer plugin distribution assets for the catalog-v3 lane."
            gh release upload "${tag}" \
              "${release_assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          done < release-plan.tsv

      - name: Stage prepared plugin artifacts
        run: |
          set -euo pipefail
          rm -rf prepared-plugins
          mkdir -p "prepared-plugins/${{ matrix.plugin_id }}"
          cp -R "dist/prepared/${{ matrix.plugin_id }}/${{ matrix.version }}" "prepared-plugins/${{ matrix.plugin_id }}/${{ matrix.version }}"

      - name: Show sccache stats
        if: always()
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats | tee prepare-sccache-stats.txt
          else
            echo "sccache unavailable" | tee prepare-sccache-stats.txt
          fi

      - name: Upload prepared plugin artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plugin-v3-prepared-${{ github.run_id }}-${{ matrix.plugin_id }}-${{ matrix.version }}
          path: prepared-plugins
          if-no-files-found: error
          retention-days: 7

      - name: Upload release stats
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plugin-v3-artifacts-${{ github.run_id }}-${{ matrix.plugin_id }}-${{ matrix.version }}
          path: prepare-sccache-stats.txt
          if-no-files-found: error
          retention-days: 7

  validate-release-rule-pack:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugins-v3/release/') && needs.plan-release.outputs.has_rule_packs == 'true' && needs.plan-release.outputs.catalog_only != 'true' }}
    needs: [plan-release]
    name: validate-rule-pack (${{ matrix.rule_pack_id }} ${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-release.outputs.rule_pack_matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require release trigger tag
        run: |
          source .github/scripts/release-plugin-v3-identity.sh
          require_release_publish_context "${GITHUB_EVENT_NAME}" "${GITHUB_REF}"

      - name: Validate tagged rule-pack manifest
        run: |
          set -euo pipefail
          asset="$(jq -r --arg id "${{ matrix.rule_pack_id }}" '.rule_packs[] | select(.id == $id) | .asset' rule_packs/manifest.json)"
          test -n "${asset}"
          test "${asset}" != "null"
          go run .github/scripts/release_workflow_plan.go \
            --check-rule-pack-version \
            --rule-pack-id "${{ matrix.rule_pack_id }}" \
            --tag-version "${{ matrix.version }}" \
            --manifest "rule_packs/${asset}"

  collect-release-provenance-subjects:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugins-v3/release/') && needs.plan-release.outputs.has_plugins == 'true' && needs.plan-release.outputs.catalog_only != 'true' }}
    needs: [plan-release, build-sign-release-plugin]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      subjects-file: ${{ steps.subjects.outputs.handle }}
    steps:
      - name: Download prepared release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-plugin-v3-prepared-${{ github.run_id }}-*
          path: release-artifacts
          merge-multiple: true

      - name: Create release subject list
        run: |
          set -euo pipefail
          find release-artifacts -type f \
            \( -name '*.wasm.zst' -o -name '*.wasm.br' -o -name '*.spdx.json' -o -name 'catalog-v3.json' \) \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum > release-subjects.sha256
          base64 -w0 release-subjects.sha256 > release-subjects.sha256.base64
          test -s release-subjects.sha256.base64

      - name: Share release subject list with the SLSA generator
        id: subjects
        uses: slsa-framework/slsa-github-generator/actions/generator/generic/create-base64-subjects-from-file@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
        with:
          path: release-subjects.sha256.base64

  generate-release-provenance:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugins-v3/release/') && needs.collect-release-provenance-subjects.result == 'success' }}
    needs: [collect-release-provenance-subjects]
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects-as-file: ${{ needs.collect-release-provenance-subjects.outputs.subjects-file }}
      provenance-name: scryer-plugin-artifacts.intoto.jsonl
      compile-generator: true

  publish-release-provenance:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugins-v3/release/') && needs.plan-release.outputs.has_plugins == 'true' && needs.plan-release.outputs.catalog_only != 'true' }}
    needs: [plan-release, generate-release-provenance]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_MATRIX: ${{ needs.plan-release.outputs.plugin_matrix }}
      PROVENANCE_NAME: ${{ needs.generate-release-provenance.outputs.provenance-name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download signed SLSA provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.generate-release-provenance.outputs.provenance-name }}
          path: provenance

      - name: Attach provenance to every published plugin release
        run: |
          set -euo pipefail
          provenance_path="provenance/${PROVENANCE_NAME}"
          test -f "${provenance_path}"
          while IFS= read -r tag; do
            gh release upload "${tag}" "${provenance_path}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          done < <(printf '%s' "${RELEASE_MATRIX}" | jq -r '.include[] | "plugins-v3/\(.plugin_id)/v\(.version)"')

  publish-central-catalog:
    if: ${{ always() && !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugins-v3/release/') && needs.plan-release.result == 'success' && (needs.build-sign-release-plugin.result == 'success' || needs.build-sign-release-plugin.result == 'skipped') && (needs.validate-release-rule-pack.result == 'success' || needs.validate-release-rule-pack.result == 'skipped') && (needs.publish-release-provenance.result == 'success' || needs.publish-release-provenance.result == 'skipped') }}
    needs: [plan-release, build-sign-release-plugin, validate-release-rule-pack, publish-release-provenance]
    runs-on: ubuntu-latest
    # One publish at a time. GitHub keeps at most one pending run per group:
    # a third run queued while two are waiting is cancelled, not queued.
    # A cancelled run published nothing and saved no preparation, so
    # rerunning it after the others finish prepares afresh on the new base.
    concurrency:
      group: central-catalog-v3
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_R2_BUCKET_ID: ${{ vars.CF_R2_BUCKET_ID }}
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      GH_TOKEN: ${{ github.token }}
      # Repair override: a signed full-catalog asset (on the cdn catalog path
      # or the catalog/v3 release) to merge onto instead of the one the modern
      # redirect serves. Unset it again once the repair has published.
      SCRYER_CATALOG_MERGE_BASE_ASSET: ${{ vars.SCRYER_CATALOG_MERGE_BASE_ASSET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require release trigger tag
        run: |
          source .github/scripts/release-plugin-v3-identity.sh
          require_release_publish_context "${GITHUB_EVENT_NAME}" "${GITHUB_REF}"

      - name: Require successful selected release paths
        run: |
          set -euo pipefail
          go run .github/scripts/release_workflow_plan.go \
            --check-central-gate \
            --event-name "${GITHUB_EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --has-plugins="${{ needs.plan-release.outputs.has_plugins }}" \
            --has-rule-packs="${{ needs.plan-release.outputs.has_rule_packs }}" \
            --plugin-build "${{ needs.build-sign-release-plugin.result }}" \
            --rule-pack-build "${{ needs.validate-release-rule-pack.result }}" \
            --provenance "${{ needs.publish-release-provenance.result }}"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Install central publish tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip zstd
          python3 -m pip install --user --require-hashes -r .github/awscli-requirements.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download xtask artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plugin-v3-xtask-${{ github.run_id }}
          path: xtask-artifact

      - name: Download release plan artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plugin-v3-plan-${{ github.run_id }}
          path: release-plan-artifact

      # Before any input is fetched: a rerun that finds the signed preparation
      # of an earlier attempt republishes exactly those bytes and needs none
      # of the inputs the preparation was built from.
      - name: Restore signed catalog preparation
        id: catalog-preparation
        run: |
          set -euo pipefail
          bash .github/scripts/catalog-v3-preparation.sh restore dist/catalog-v3

      - name: Download prepared plugin artifacts
        if: ${{ needs.plan-release.outputs.has_plugins == 'true' && needs.plan-release.outputs.catalog_only != 'true' && steps.catalog-preparation.outputs.restored != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-plugin-v3-prepared-${{ github.run_id }}-*
          path: prepared-plugins
          merge-multiple: true

      - name: Restore xtask binary
        run: |
          set -euo pipefail
          install -d xtask/target/xtask-release
          install -m 0755 xtask-artifact/xtask xtask/target/xtask-release/xtask

      - name: Restore full release plan
        run: |
          set -euo pipefail
          install -m 0644 release-plan-artifact/release-plugin-plan.tsv release-plugin-plan.tsv
          install -m 0644 release-plan-artifact/release-rule-pack-plan.tsv release-rule-pack-plan.tsv
          if [ ! -s release-plugin-plan.tsv ] && [ ! -s release-rule-pack-plan.tsv ]; then
            echo "Component release plans are empty" >&2
            exit 1
          fi

      - name: Restore catalog-only plugin snippets
        if: ${{ needs.plan-release.outputs.catalog_only == 'true' && steps.catalog-preparation.outputs.restored != 'true' }}
        run: |
          set -euo pipefail
          source .github/scripts/release-plugin-v3-identity.sh
          require_release_publish_context "${GITHUB_EVENT_NAME}" "${GITHUB_REF}"
          while IFS=$'\t' read -r plugin_id version _source_commit; do
            [ -n "${plugin_id}" ] || continue
            tag="plugins-v3/${plugin_id}/v${version}"
            prepared_dir="prepared-plugins/${plugin_id}/${version}"
            mkdir -p "${prepared_dir}"
            gh release download "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern catalog-v3.json \
              --pattern catalog-v3.json.bundle \
              --dir "${prepared_dir}" \
              --clobber
            verify_release_blob_tag_bound \
              "${prepared_dir}/catalog-v3.json" \
              "${prepared_dir}/catalog-v3.json.bundle" \
              "${GITHUB_REPOSITORY}"
          done < release-plugin-plan.tsv

      - name: Verify prepared plugin artifacts
        if: ${{ needs.plan-release.outputs.has_plugins == 'true' && needs.plan-release.outputs.catalog_only != 'true' && steps.catalog-preparation.outputs.restored != 'true' }}
        run: |
          set -euo pipefail
          readonly parallelism=4
          declare -a active_pids=()
          failed=0

          wait_for_slot() {
            while (( ${#active_pids[@]} >= parallelism )); do
              if ! wait -n "${active_pids[@]}"; then
                failed=1
              fi
              local -a remaining=()
              local pid
              for pid in "${active_pids[@]}"; do
                if kill -0 "${pid}" 2>/dev/null; then
                  remaining+=("${pid}")
                fi
              done
              active_pids=("${remaining[@]}")
            done
          }

          while IFS=$'\t' read -r plugin_id version _source_commit; do
            [ -n "${plugin_id}" ] || continue
            wait_for_slot
            if (( failed )); then
              break
            fi
            (
              echo "Verifying prepared artifacts for ${plugin_id} ${version}"
              ./xtask/target/xtask-release/xtask official verify-prepared "prepared-plugins/${plugin_id}/${version}"
            ) &
            active_pids+=("$!")
          done < release-plugin-plan.tsv

          for pid in "${active_pids[@]}"; do
            if ! wait "${pid}"; then
              failed=1
            fi
          done
          (( ! failed ))

      - name: Verify selected plugin signing identities
        if: ${{ needs.plan-release.outputs.has_plugins == 'true' && needs.plan-release.outputs.catalog_only != 'true' && steps.catalog-preparation.outputs.restored != 'true' }}
        run: |
          set -euo pipefail
          source .github/scripts/release-plugin-v3-identity.sh
          require_release_publish_context "${GITHUB_EVENT_NAME}" "${GITHUB_REF}"
          while IFS=$'\t' read -r plugin_id version _source_commit; do
            [ -n "${plugin_id}" ] || continue
            prepared_dir="prepared-plugins/${plugin_id}/${version}"
            while IFS= read -r artifact_name; do
              [ -n "${artifact_name}" ] || continue
              zstd -dc \
                "${prepared_dir}/${artifact_name}.bundle.zst" \
                > "${prepared_dir}/${artifact_name}.bundle"
              verify_release_blob \
                "${prepared_dir}/${artifact_name}" \
                "${prepared_dir}/${artifact_name}.bundle" \
                "${GITHUB_REPOSITORY}" \
                "${GITHUB_REF}"
              rm -f "${prepared_dir}/${artifact_name}.bundle"
            done < "${prepared_dir}/v3-artifacts.txt"
            if [ -f "${prepared_dir}/catalog-v3.json" ]; then
              verify_release_blob \
                "${prepared_dir}/catalog-v3.json" \
                "${prepared_dir}/catalog-v3.json.bundle" \
                "${GITHUB_REPOSITORY}" \
                "${GITHUB_REF}"
            fi
          done < release-plugin-plan.tsv

      - name: Prepare and sign central catalog
        if: steps.catalog-preparation.outputs.restored != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          source .github/scripts/release-plugin-v3-identity.sh
          require_release_publish_context "${GITHUB_EVENT_NAME}" "${GITHUB_REF}"
          mapfile -t plugin_ids < <(cut -f1 release-plugin-plan.tsv | sort -u)
          mapfile -t rule_pack_ids < <(cut -f1 release-rule-pack-plan.tsv | sort -u)
          prepare_v3_args=(
            --out dist/catalog-v3
          )
          if (( ${#plugin_ids[@]} > 0 )); then
            prepare_v3_args+=(--prepared-plugin-root prepared-plugins)
          fi
          # The merge base must be the FULL catalog, and an unattended publish
          # (the nightly rule-pack refreshes included) has exactly one source
          # for it: the signed modern redirect, which points at the unfiltered
          # master. Supported clients read that redirect from the cdn first
          # and from the catalog/v3 release second, so the merge base reads
          # both copies, verifies both signatures, and requires them to name
          # the same generation and the same master asset. A disagreement
          # ("mirror behind cdn" or "cdn behind mirror") fails the job instead
          # of merging onto a generation one of the two never served. The
          # master itself downloads from the cdn URL in the redirect, falling
          # back to the mirror URL from the same redirect.
          #
          # The legacy redirect ladder is frozen and never read: its rungs are
          # per-stratum projections, and merging onto one silently drops every
          # release the projection filtered out, for the whole fleet. So there
          # is no fallback to it; a transient failure retries and then fails
          # the job. Only an operator can name a different merge base, through
          # SCRYER_CATALOG_MERGE_BASE_ASSET.
          #
          # merge_base_asset is the master the live cdn redirect serves. The
          # publisher compare-and-sets the redirect against it, so a publish
          # that lands between this read and ours is rejected, not overwritten.
          source .github/scripts/catalog-v3-merge-base.sh
          existing_dir="existing-central-catalog-v3"
          resolve_catalog_v3_merge_base "${existing_dir}" "${GITHUB_REPOSITORY}"
          prepare_v3_args+=(--existing-catalog "${existing_dir}/${catalog_asset}")
          for plugin_id in "${plugin_ids[@]}"; do
            prepare_v3_args+=(--plugin-id "${plugin_id}")
          done
          for rule_pack_id in "${rule_pack_ids[@]}"; do
            prepare_v3_args+=(--rule-pack-id "${rule_pack_id}")
          done
          ./xtask/target/xtask-release/xtask catalog prepare-v3 "${prepare_v3_args[@]}"
          bash .github/scripts/verify-catalog-v3-release-identities.sh \
            dist/catalog-v3/catalog-v3.json \
            "${GITHUB_REPOSITORY}"
          for asset in catalog-v3.min.json.zst; do
            cosign sign-blob \
              --yes \
              --bundle "dist/catalog-v3/${asset}.bundle" \
              "dist/catalog-v3/${asset}"
            verify_release_blob \
              "dist/catalog-v3/${asset}" \
              "dist/catalog-v3/${asset}.bundle" \
              "${GITHUB_REPOSITORY}" \
              "${GITHUB_REF}"
          done
          cosign sign-blob \
            --yes \
            --bundle "dist/catalog-v3/catalog-v3.modern.redirect.bundle.json" \
            "dist/catalog-v3/catalog-v3.modern.redirect.json"
          verify_release_blob \
            "dist/catalog-v3/catalog-v3.modern.redirect.json" \
            "dist/catalog-v3/catalog-v3.modern.redirect.bundle.json" \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_REF}"
          cp "dist/catalog-v3/catalog-v3.modern.redirect.bundle.json" \
            "dist/catalog-v3/catalog-v3.modern.redirect.sigstore.json"

          # Hashed assets staged by this preparation: the new master catalog
          # and any new rule-pack blobs. Each gets a signature bundle before
          # the publisher uploads it.
          signing_list="${RUNNER_TEMP}/catalog-v3-staged-assets.txt"
          go run .github/scripts/release_workflow_plan.go \
            --central-assets-dir dist/catalog-v3 \
            > "${signing_list}"
          test -s "${signing_list}"

          while IFS= read -r asset_name; do
            [ -n "${asset_name}" ] || continue
            test -f "dist/catalog-v3/${asset_name}"
            cosign sign-blob \
              --yes \
              --bundle "dist/catalog-v3/${asset_name}.bundle" \
              "dist/catalog-v3/${asset_name}"
            verify_release_blob \
              "dist/catalog-v3/${asset_name}" \
              "dist/catalog-v3/${asset_name}.bundle" \
              "${GITHUB_REPOSITORY}" \
              "${GITHUB_REF}"
            cp "dist/catalog-v3/${asset_name}.bundle" \
              "dist/catalog-v3/${asset_name}.sigstore.json"
            zstd -19 -f "dist/catalog-v3/${asset_name}.bundle" -o "dist/catalog-v3/${asset_name}.bundle.zst"
            rm -f "dist/catalog-v3/${asset_name}.bundle"
            test -s "dist/catalog-v3/${asset_name}.bundle.zst"
            test -s "dist/catalog-v3/${asset_name}.sigstore.json"
          done < "${signing_list}"

          printf '%s\n' "${merge_base_asset}" > dist/catalog-v3/expected-merge-base

      - name: Save signed catalog preparation before publication
        if: steps.catalog-preparation.outputs.restored != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-catalog-preparation-${{ github.run_id }}
          path: dist/catalog-v3
          if-no-files-found: error
          retention-days: 90

      - name: Publish saved catalog preparation
        run: |
          set -euo pipefail
          # The merge base travels with the preparation so a rerun compares
          # against the base this preparation was really built on.
          if ! test -s dist/catalog-v3/expected-merge-base; then
            echo "dist/catalog-v3/expected-merge-base is missing or empty; refusing to publish" >&2
            exit 1
          fi
          read -r expected_merge_base < dist/catalog-v3/expected-merge-base
          test -n "${expected_merge_base}"
          ./xtask/target/xtask-release/xtask catalog publish-v3-generation \
            --dist dist/catalog-v3 \
            --expected-merge-base "${expected_merge_base}"

  diagnose-central-catalog-repair:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.catalog_repair_specs != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ github.token }}
      # Render against the same merge base publish-central-catalog would use.
      SCRYER_CATALOG_MERGE_BASE_ASSET: ${{ vars.SCRYER_CATALOG_MERGE_BASE_ASSET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Install central repair diagnostic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Build xtask
        run: cargo build --locked --profile xtask-release --manifest-path xtask/Cargo.toml --bin xtask

      - name: Parse catalog repair specs
        run: |
          set -euo pipefail
          specs="${{ inputs.catalog_repair_specs }}"
          : > repair-plan.tsv
          printf '%s\n' "${specs}" \
            | tr ',[:space:]' '\n' \
            | awk 'NF' \
            | while IFS= read -r spec; do
                case "${spec}" in
                  *@*)
                    plugin_id="${spec%@*}"
                    version="${spec#*@}"
                    ;;
                  *)
                    echo "Invalid repair spec '${spec}'; expected plugin_id@version" >&2
                    exit 1
                    ;;
                esac
                if [ -z "${plugin_id}" ] || [ -z "${version}" ]; then
                  echo "Invalid repair spec '${spec}'; expected plugin_id@version" >&2
                  exit 1
                fi
                printf '%s\t%s\n' "${plugin_id}" "${version}" >> repair-plan.tsv
              done
          if [ ! -s repair-plan.tsv ]; then
            echo "No catalog repair specs were provided" >&2
            exit 1
          fi
          sort -u repair-plan.tsv -o repair-plan.tsv
          printf 'Catalog repair plan\n'
          while IFS=$'\t' read -r plugin_id version; do
            printf ' - %s %s\n' "${plugin_id}" "${version}"
          done < repair-plan.tsv

      - name: Download and verify current central catalog
        run: |
          set -euo pipefail
          source .github/scripts/release-plugin-v3-identity.sh
          # Diagnostics render against the FULL catalog the next publish would
          # merge onto, read exactly as publish-central-catalog reads it: the
          # modern redirect from the cdn and the catalog/v3 release, which must
          # agree. The frozen legacy redirect is never read.
          source .github/scripts/catalog-v3-merge-base.sh
          existing_dir="existing-central-catalog-v3"
          resolve_catalog_v3_merge_base "${existing_dir}" "${GITHUB_REPOSITORY}"
          echo "catalog_asset=${catalog_asset}" >> "$GITHUB_ENV"

      - name: Download and verify historical plugin snippets
        run: |
          set -euo pipefail
          source .github/scripts/release-plugin-v3-identity.sh
          snippets_root="repair-snippets"
          mkdir -p "${snippets_root}"
          while IFS=$'\t' read -r plugin_id version; do
            tag="plugins-v3/${plugin_id}/v${version}"
            plugin_dir="${snippets_root}/${plugin_id}"
            tmp_dir="downloaded-snippets/${plugin_id}-${version}"
            mkdir -p "${plugin_dir}" "${tmp_dir}"
            gh release download "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern catalog-v3.json \
              --pattern catalog-v3.json.bundle \
              --dir "${tmp_dir}" \
              --clobber
            verify_release_blob_tag_bound \
              "${tmp_dir}/catalog-v3.json" \
              "${tmp_dir}/catalog-v3.json.bundle" \
              "${GITHUB_REPOSITORY}"
            python3 -c 'import json, sys; from pathlib import Path; plugin_id, version, snippet_path = sys.argv[1:]; snippet = json.loads(Path(snippet_path).read_text()); releases = snippet.get("releases") or []; sys.exit("snippet id {} does not match {}".format(snippet.get("id"), plugin_id)) if snippet.get("id") != plugin_id else None; sys.exit("snippet {} does not contain release {}".format(plugin_id, version)) if not any(release.get("version") == version for release in releases) else None' "${plugin_id}" "${version}" "${tmp_dir}/catalog-v3.json"
            install -m 0644 "${tmp_dir}/catalog-v3.json" "${plugin_dir}/catalog-v3.json"
          done < repair-plan.tsv

      - name: Render repaired central catalog diagnostics
        run: |
          set -euo pipefail
          mapfile -t plugin_ids < <(cut -f1 repair-plan.tsv | sort -u)
          prepare_v3_args=(
            --out dist/catalog-v3
            --existing-catalog "existing-central-catalog-v3/${catalog_asset}"
            --prepared-plugin-root repair-snippets
          )
          for plugin_id in "${plugin_ids[@]}"; do
            prepare_v3_args+=(--plugin-id "${plugin_id}")
          done
          ./xtask/target/xtask-release/xtask catalog prepare-v3 "${prepare_v3_args[@]}"

      - name: Upload repaired catalog diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plugin-v3-catalog-repair-diagnostics-${{ github.run_id }}
          path: dist/catalog-v3
          if-no-files-found: error
          retention-days: 7
