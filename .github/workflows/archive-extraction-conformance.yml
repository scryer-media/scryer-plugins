name: archive-extraction-conformance

on:
  pull_request:
    paths:
      - .gitattributes
      - archive_extractors/archive-extraction/**
      - pdk/scryer-plugin-pdk/**
      - .github/workflows/archive-extraction-conformance.yml
  workflow_dispatch:

concurrency:
  group: archive-extraction-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  archive-extraction-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run archive-extraction host conformance
        run: >-
          cargo test --locked
          --manifest-path archive_extractors/archive-extraction/Cargo.toml
          --test host_conformance
