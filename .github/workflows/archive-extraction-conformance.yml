name: archive-extraction-conformance

on:
  pull_request:
    paths:
      - .gitattributes
      - archive_extractors/archive-extraction/**
      - pdk/scryer-plugin-pdk/**
      - .github/workflows/archive-extraction-conformance.yml
  workflow_dispatch:

concurrency:
  group: archive-extraction-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  archive-extraction-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # The archive extractor is a WASI Preview 2 component, and the
          # conformance suite builds that exact release artifact.
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run archive-extraction host conformance
        run: >-
          cargo test --locked
          --manifest-path archive_extractors/archive-extraction/Cargo.toml
          --test host_conformance
