name: archive-extraction-conformance

on:
  pull_request:
    paths:
      - .gitattributes
      - archive_extractors/archive-extraction/**
      - pdk/scryer-plugin-pdk/**
      - .github/workflows/archive-extraction-conformance.yml
  workflow_dispatch:

concurrency:
  group: archive-extraction-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  archive-extraction-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # The archive extractor is a WASI Preview 2 component, and the
          # conformance suite builds that exact release artifact.
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install WASI SDK for native archive libraries
        shell: bash
        run: |
          set -euo pipefail
          readonly wasi_sdk_version='33.0'
          readonly wasi_sdk_archive="wasi-sdk-${wasi_sdk_version}-x86_64-linux.tar.gz"
          readonly wasi_sdk_sha256='0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce'
          readonly wasi_sdk_root="${RUNNER_TEMP}/wasi-sdk-${wasi_sdk_version}"
          readonly wasi_sdk_url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/${wasi_sdk_archive}"
          curl -fsSL "$wasi_sdk_url" -o "${RUNNER_TEMP}/${wasi_sdk_archive}"
          printf '%s  %s\n' "$wasi_sdk_sha256" "${RUNNER_TEMP}/${wasi_sdk_archive}" | sha256sum --check --strict
          mkdir "$wasi_sdk_root"
          tar -xzf "${RUNNER_TEMP}/${wasi_sdk_archive}" -C "$wasi_sdk_root" --strip-components=1
          test -x "$wasi_sdk_root/bin/clang"
          test -d "$wasi_sdk_root/share/wasi-sysroot"
          echo "$wasi_sdk_root/bin" >> "$GITHUB_PATH"
          {
            echo "WASI_SYSROOT=$wasi_sdk_root/share/wasi-sysroot"
            echo "CLANG=$wasi_sdk_root/bin/clang"
            echo "LLVM_AR=$wasi_sdk_root/bin/llvm-ar"
            echo "LLVM_NM=$wasi_sdk_root/bin/llvm-nm"
            echo "LLVM_RANLIB=$wasi_sdk_root/bin/llvm-ranlib"
            echo "LLVM_STRIP=$wasi_sdk_root/bin/llvm-strip"
            # liblzma's C sources are compiled by cc-rs, which resolves its
            # compiler per target and otherwise falls back to whatever `clang`
            # is first on PATH. Naming the WASI SDK toolchain for the component
            # target keeps that resolution independent of PATH order.
            echo "CC_wasm32_wasip2=$wasi_sdk_root/bin/clang"
            echo "AR_wasm32_wasip2=$wasi_sdk_root/bin/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Run archive-extraction host conformance
        run: >-
          cargo test --locked
          --manifest-path archive_extractors/archive-extraction/Cargo.toml
          --test host_conformance
