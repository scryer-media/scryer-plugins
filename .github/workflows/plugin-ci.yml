name: plugin-ci

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-identity-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test release identity policy
        run: bash .github/scripts/release-plugin-v3-identity.test.sh

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      plugin_ids: ${{ steps.scope.outputs.plugin_ids }}
      plugin_matrix: ${{ steps.scope.outputs.plugin_matrix }}
      quality_matrix: ${{ steps.scope.outputs.quality_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine CI scope
        id: scope
        shell: bash
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          python3 .github/scripts/plan-plugin-ci.py \
            --changed-files "$RUNNER_TEMP/changed-files.txt" >> "$GITHUB_OUTPUT"

  quality:
    needs: plan
    if: ${{ needs.plan.outputs.mode != 'none' }}
    name: quality (${{ matrix.id || 'not-needed' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.quality_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
          targets: wasm32-wasip1,wasm32-wasip2

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-audit

      - name: Check formatting
        working-directory: ${{ matrix.directory }}
        run: cargo fmt --check

      - name: Run cargo audit
        working-directory: ${{ matrix.directory }}
        run: |
          audit_ignores=(
            --ignore RUSTSEC-2026-0085
            --ignore RUSTSEC-2026-0086
            --ignore RUSTSEC-2026-0087
            --ignore RUSTSEC-2026-0088
            --ignore RUSTSEC-2026-0089
            --ignore RUSTSEC-2026-0091
            --ignore RUSTSEC-2026-0092
            --ignore RUSTSEC-2026-0093
            --ignore RUSTSEC-2026-0094
            --ignore RUSTSEC-2026-0095
            --ignore RUSTSEC-2026-0096
            --ignore RUSTSEC-2026-0114
            --ignore RUSTSEC-2026-0222
          )
          if [[ "${{ matrix.id }}" == "xtask" ]]; then
            # Extism 1.30.0 still requires unsupported Wasmtime 43. Remove this
            # exception when Extism ships its Wasmtime 46 migration (extism/extism#905).
            audit_ignores+=(--ignore RUSTSEC-2026-0269)
          fi
          cargo audit --file Cargo.lock "${audit_ignores[@]}"

      - name: Run strict clippy
        working-directory: ${{ matrix.directory }}
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build xtask
        if: ${{ matrix.kind == 'xtask' }}
        working-directory: xtask
        run: cargo build --locked

      - name: Upload xtask artifact
        if: ${{ matrix.kind == 'xtask' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-ci-xtask-${{ github.run_id }}
          path: xtask/target/debug/xtask
          if-no-files-found: error
          retention-days: 1

  wasm-validate:
    needs: [plan, quality]
    if: ${{ needs.plan.outputs.mode != 'none' && needs.quality.result == 'success' }}
    name: wasm validate (${{ matrix.plugin_id || 'not-needed' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.plugin_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: wasm32-wasip1,wasm32-wasip2

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Download xtask artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-ci-xtask-${{ github.run_id }}
          path: xtask-artifact

      - name: Restore xtask binary
        run: |
          set -euo pipefail
          install -d xtask/target/debug
          install -m 0755 xtask-artifact/xtask xtask/target/debug/xtask

      - name: Install WASI SDK for enhanced subtitle sync
        if: ${{ matrix.plugin_id == 'enhanced-subtitle-sync' }}
        shell: bash
        run: |
          set -euo pipefail
          readonly wasi_sdk_version='33.0'
          readonly wasi_sdk_archive="wasi-sdk-${wasi_sdk_version}-x86_64-linux.tar.gz"
          readonly wasi_sdk_sha256='0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce'
          readonly wasi_sdk_root="${RUNNER_TEMP}/wasi-sdk-${wasi_sdk_version}"
          readonly wasi_sdk_url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/${wasi_sdk_archive}"
          curl -fsSL "$wasi_sdk_url" -o "${RUNNER_TEMP}/${wasi_sdk_archive}"
          printf '%s  %s\n' "$wasi_sdk_sha256" "${RUNNER_TEMP}/${wasi_sdk_archive}" | sha256sum --check --strict
          mkdir "$wasi_sdk_root"
          tar -xzf "${RUNNER_TEMP}/${wasi_sdk_archive}" -C "$wasi_sdk_root" --strip-components=1
          test -x "$wasi_sdk_root/bin/clang"
          test -d "$wasi_sdk_root/share/wasi-sysroot"
          echo "$wasi_sdk_root/bin" >> "$GITHUB_PATH"
          {
            echo "WASI_SYSROOT=$wasi_sdk_root/share/wasi-sysroot"
            echo "FFMPEG_WASI_SYSROOT=$wasi_sdk_root/share/wasi-sysroot"
            echo "CLANG=$wasi_sdk_root/bin/clang"
            echo "LLVM_AR=$wasi_sdk_root/bin/llvm-ar"
            echo "LLVM_NM=$wasi_sdk_root/bin/llvm-nm"
            echo "LLVM_RANLIB=$wasi_sdk_root/bin/llvm-ranlib"
            echo "LLVM_STRIP=$wasi_sdk_root/bin/llvm-strip"
          } >> "$GITHUB_ENV"

      - name: Prefetch plugin release dependencies
        run: ./xtask/target/debug/xtask official prefetch "${{ matrix.plugin_id }}"

      - name: Validate official plugins through the release Wasm path
        run: ./xtask/target/debug/xtask plugin validate-all --plugin-id "${{ matrix.plugin_id }}"

  gate:
    if: ${{ always() }}
    needs: [plan, quality, wasm-validate]
    name: plugin-ci gate
    runs-on: ubuntu-latest
    steps:
      - name: Verify planned CI completed
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          QUALITY: ${{ needs.quality.result }}
          WASM_VALIDATE: ${{ needs.wasm-validate.result }}
        run: |
          set -euo pipefail
          case "$MODE" in
            none)
              test "$QUALITY" = skipped
              test "$WASM_VALIDATE" = skipped
              ;;
            scoped)
              test "$QUALITY" = success
              test "$WASM_VALIDATE" = success
              ;;
            full)
              test "$QUALITY" = success
              test "$WASM_VALIDATE" = success
              ;;
            *)
              echo "Unexpected CI mode: $MODE" >&2
              exit 1
              ;;
          esac
