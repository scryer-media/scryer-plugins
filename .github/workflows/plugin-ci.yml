name: plugin-ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: plugin-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      plugin_ids: ${{ steps.scope.outputs.plugin_ids }}
      plugin_matrix: ${{ steps.scope.outputs.plugin_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine CI scope
        id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            python3 .github/scripts/plan-plugin-ci.py --full >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          python3 .github/scripts/plan-plugin-ci.py \
            --changed-files "$RUNNER_TEMP/changed-files.txt" >> "$GITHUB_OUTPUT"

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo run --locked --manifest-path xtask/Cargo.toml -- ci fmt

  clippy:
    needs: plan
    name: clippy (${{ matrix.plugin_id || 'not-needed' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.plugin_matrix) }}
    steps:
      - name: No Rust changes require clippy
        if: ${{ matrix.plugin_id == '' }}
        run: echo "No plugin or shared Rust changes detected."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ matrix.plugin_id != '' }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: ${{ matrix.plugin_id != '' }}
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ matrix.plugin_id != '' }}

      - name: Run strict clippy
        if: ${{ matrix.plugin_id != '' }}
        run: cargo run --locked --manifest-path xtask/Cargo.toml -- ci clippy --plugin-id "${{ matrix.plugin_id }}"

  clippy-xtask:
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Clippy for the active toolchain
        run: rustup component add clippy --toolchain "$(rustup show active-toolchain | awk '{print $1}')"

      - name: Run strict clippy for xtask
        run: cargo clippy --all-targets --all-features --locked --manifest-path xtask/Cargo.toml -- -D warnings

  audit:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: No Rust changes require an audit
        if: ${{ needs.plan.outputs.mode == 'none' }}
        run: echo "No plugin or shared Rust changes detected."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.plan.outputs.mode != 'none' }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: ${{ needs.plan.outputs.mode != 'none' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ needs.plan.outputs.mode != 'none' }}

      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        if: ${{ needs.plan.outputs.mode != 'none' }}
        with:
          tool: cargo-audit

      - name: Run cargo audit
        if: ${{ needs.plan.outputs.mode != 'none' }}
        env:
          CI_SCOPE: ${{ needs.plan.outputs.mode }}
          CI_PLUGIN_IDS: ${{ needs.plan.outputs.plugin_ids }}
        run: |
          scope_args=()
          if [[ "$CI_SCOPE" == "scoped" ]]; then
            IFS=',' read -r -a plugin_ids <<< "$CI_PLUGIN_IDS"
            for plugin_id in "${plugin_ids[@]}"; do
              scope_args+=(--plugin-id "$plugin_id")
            done
          fi
          cargo run --locked --manifest-path xtask/Cargo.toml -- ci audit "${scope_args[@]}"

  wasm-validate:
    needs: plan
    name: wasm-validate (${{ matrix.plugin_id || 'not-needed' }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.plugin_matrix) }}
    steps:
      - name: No Rust changes require Wasm validation
        if: ${{ matrix.plugin_id == '' }}
        run: echo "No plugin or shared Rust changes detected."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ matrix.plugin_id != '' }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: ${{ matrix.plugin_id != '' }}
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ matrix.plugin_id != '' }}

      - name: Install WASI SDK for enhanced subtitle sync
        if: ${{ matrix.plugin_id == 'enhanced-subtitle-sync' }}
        shell: bash
        run: |
          set -euo pipefail
          readonly wasi_sdk_version='33.0'
          readonly wasi_sdk_archive="wasi-sdk-${wasi_sdk_version}-x86_64-linux.tar.gz"
          readonly wasi_sdk_sha256='0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce'
          readonly wasi_sdk_root="${RUNNER_TEMP}/wasi-sdk-${wasi_sdk_version}"
          readonly wasi_sdk_url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/${wasi_sdk_archive}"
          curl -fsSL "$wasi_sdk_url" -o "${RUNNER_TEMP}/${wasi_sdk_archive}"
          printf '%s  %s\n' "$wasi_sdk_sha256" "${RUNNER_TEMP}/${wasi_sdk_archive}" | sha256sum --check --strict
          mkdir "$wasi_sdk_root"
          tar -xzf "${RUNNER_TEMP}/${wasi_sdk_archive}" -C "$wasi_sdk_root" --strip-components=1
          test -x "$wasi_sdk_root/bin/clang"
          test -d "$wasi_sdk_root/share/wasi-sysroot"
          echo "$wasi_sdk_root/bin" >> "$GITHUB_PATH"
          {
            echo "WASI_SYSROOT=$wasi_sdk_root/share/wasi-sysroot"
            echo "FFMPEG_WASI_SYSROOT=$wasi_sdk_root/share/wasi-sysroot"
            echo "CLANG=$wasi_sdk_root/bin/clang"
            echo "LLVM_AR=$wasi_sdk_root/bin/llvm-ar"
            echo "LLVM_NM=$wasi_sdk_root/bin/llvm-nm"
            echo "LLVM_RANLIB=$wasi_sdk_root/bin/llvm-ranlib"
            echo "LLVM_STRIP=$wasi_sdk_root/bin/llvm-strip"
          } >> "$GITHUB_ENV"

      - name: Prefetch plugin release dependencies
        if: ${{ matrix.plugin_id != '' }}
        run: cargo run --locked --manifest-path xtask/Cargo.toml -- official prefetch "${{ matrix.plugin_id }}"

      - name: Validate official plugins through the release Wasm path
        if: ${{ matrix.plugin_id != '' }}
        run: cargo run --locked --manifest-path xtask/Cargo.toml -- plugin validate-all --plugin-id "${{ matrix.plugin_id }}"
