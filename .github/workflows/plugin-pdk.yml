name: plugin-pdk

on:
  push:
    tags:
      - "scryer-plugin-pdk/v*"

concurrency:
  group: plugin-pdk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: true

      - name: Verify PDK tag and metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_ref="${GITHUB_REF_NAME}"
          tag_object="$(git rev-parse "${expected_ref}^{tag}")"
          tag_commit="$(git rev-parse "${expected_ref}^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "${checked_out_commit}" != "${tag_commit}" ]; then
            echo "Checked out ${checked_out_commit}, expected ${tag_commit} from ${expected_ref}."
            exit 1
          fi
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.verification.verified')" != "true" ]; then
            echo "GitHub does not report ${expected_ref} as a verified signed tag."
            exit 1
          fi
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          manifest = tomllib.loads(
              pathlib.Path("pdk/scryer-plugin-pdk/Cargo.toml").read_text()
          )
          package_version = manifest["package"]["version"]
          expected_ref = f"scryer-plugin-pdk/v{package_version}"
          actual_ref = os.environ["GITHUB_REF_NAME"]
          if actual_ref != expected_ref:
              raise SystemExit(
                  f"workflow ref {actual_ref} does not match manifest tag {expected_ref}"
              )
          PY

      - name: Check PDK formatting
        run: cargo fmt --manifest-path pdk/scryer-plugin-pdk/Cargo.toml -- --check

      - name: Test PDK
        run: cargo test --locked --manifest-path pdk/scryer-plugin-pdk/Cargo.toml

      - name: Lint PDK
        run: cargo clippy --locked --manifest-path pdk/scryer-plugin-pdk/Cargo.toml --all-targets -- -D warnings

      - name: Build PDK documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --manifest-path pdk/scryer-plugin-pdk/Cargo.toml --no-deps

      - name: Package PDK
        run: cargo package --locked --manifest-path pdk/scryer-plugin-pdk/Cargo.toml

  publish:
    name: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: validate
    environment:
      name: crates-io-publish
      url: https://crates.io/crates/scryer-plugin-pdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.97.1"

      - name: Authenticate to crates.io through Trusted Publishing
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish PDK
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          set -euo pipefail
          cargo publish --locked --manifest-path pdk/scryer-plugin-pdk/Cargo.toml
