# Host conformance for `scryer:subtitle/subtitle-provider@1.0.0` components.
#
# The sibling of archive-extraction-conformance.yml, one level up: that world
# has a single implementation, this one will have several, so the plugin is a
# matrix row. A subtitle provider migrating to the component ABI adds its
# directory to `paths` and its manifest to `include`, and gets the same check —
# the shipping `wasm32-wasip2` artifact instantiated against the real world and
# driven through `describe`/`process`.
name: subtitle-component-conformance

on:
  pull_request:
    paths:
      - subtitles/amenzb/**
      - subtitles/animetosho-xyz/**
      - subtitles/enhanced-sync/**
      - subtitles/jimaku/**
      - subtitles/opensubtitles/**
      - subtitles/subdl/**
      - subtitles/tsukihime/**
      - indexers/newznab-common-legacy/**
      - pdk/scryer-plugin-pdk/**
      - .github/workflows/subtitle-component-conformance.yml
  workflow_dispatch:

concurrency:
  group: subtitle-component-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  subtitle-component-conformance:
    name: conformance (${{ matrix.plugin }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # ameNZB is the only provider here whose search comes from a
          # shared crate (`indexers/newznab-common-legacy`), and it is now
          # that crate's only consumer. The engine is the *synchronous*
          # newznab client: it reaches Scryer only through the PDK's
          # world-agnostic surfaces, which is what lets an indexer protocol
          # engine link into a subtitle component at all. Its async sibling
          # `indexers/newznab-common` cannot be substituted — that one calls
          # `scryer:indexer/host@1.1.0` imports this world does not serve.
          # So this row is the only guard that the sync engine stays
          # world-agnostic: a stray import there builds cleanly and only
          # fails at instantiation.
          - plugin: amenzb-subtitles
            manifest: subtitles/amenzb/Cargo.toml
          - plugin: animetosho-xyz-subtitles
            manifest: subtitles/animetosho-xyz/Cargo.toml
          # The one subtitle component that compiles C — vendored FFmpeg
          # decoders and libfvad — so it is also the only row that needs the
          # WASI SDK step below. It is a *sync* provider rather than a catalog
          # one: its `process` carries `PluginSubtitleCommand::Sync`, and its
          # conformance suite aligns a real desynced subtitle against a real
          # media fixture inside the sandbox.
          - plugin: enhanced-subtitle-sync-plugin
            manifest: subtitles/enhanced-sync/Cargo.toml
            wasi_sdk: true
          - plugin: jimaku
            manifest: subtitles/jimaku/Cargo.toml
          - plugin: opensubtitles
            manifest: subtitles/opensubtitles/Cargo.toml
          - plugin: subdl
            manifest: subtitles/subdl/Cargo.toml
          - plugin: tsukihime-subtitles
            manifest: subtitles/tsukihime/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Subtitle providers are WASI Preview 2 components, and the
          # conformance suite builds that exact release artifact.
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Only `enhanced-subtitle-sync` compiles C (vendored FFmpeg decoders and
      # libfvad), so this step is gated on the row rather than paid for by the
      # six pure-Rust providers. Same WASI SDK 33 pin, same environment, as
      # archive-extraction-conformance.yml.
      - name: Install WASI SDK for the vendored C sources
        if: matrix.wasi_sdk
        shell: bash
        run: |
          set -euo pipefail
          readonly wasi_sdk_version='33.0'
          readonly wasi_sdk_archive="wasi-sdk-${wasi_sdk_version}-x86_64-linux.tar.gz"
          readonly wasi_sdk_sha256='0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce'
          readonly wasi_sdk_root="${RUNNER_TEMP}/wasi-sdk-${wasi_sdk_version}"
          readonly wasi_sdk_url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/${wasi_sdk_archive}"
          curl -fsSL "$wasi_sdk_url" -o "${RUNNER_TEMP}/${wasi_sdk_archive}"
          printf '%s  %s\n' "$wasi_sdk_sha256" "${RUNNER_TEMP}/${wasi_sdk_archive}" | sha256sum --check --strict
          mkdir "$wasi_sdk_root"
          tar -xzf "${RUNNER_TEMP}/${wasi_sdk_archive}" -C "$wasi_sdk_root" --strip-components=1
          test -x "$wasi_sdk_root/bin/clang"
          test -d "$wasi_sdk_root/share/wasi-sysroot"
          echo "$wasi_sdk_root/bin" >> "$GITHUB_PATH"
          {
            echo "WASI_SYSROOT=$wasi_sdk_root/share/wasi-sysroot"
            echo "CLANG=$wasi_sdk_root/bin/clang"
            echo "LLVM_AR=$wasi_sdk_root/bin/llvm-ar"
            echo "LLVM_NM=$wasi_sdk_root/bin/llvm-nm"
            echo "LLVM_RANLIB=$wasi_sdk_root/bin/llvm-ranlib"
            echo "LLVM_STRIP=$wasi_sdk_root/bin/llvm-strip"
            # The bridge and libfvad go through cc-rs, which resolves its
            # compiler per target and otherwise falls back to whatever `clang`
            # is first on PATH. Naming the WASI SDK toolchain for the component
            # target keeps that resolution independent of PATH order.
            echo "CC_wasm32_wasip2=$wasi_sdk_root/bin/clang"
            echo "AR_wasm32_wasip2=$wasi_sdk_root/bin/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Run subtitle host conformance
        run: >-
          cargo test --locked
          --manifest-path ${{ matrix.manifest }}
          --test host_conformance
