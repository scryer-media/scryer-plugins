name: trash-daily-refresh

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      upstream_revision:
        description: "TRaSH revision or branch to resolve to an immutable SHA"
        required: false
        default: "master"
        type: string

permissions: read-all

concurrency:
  group: trash-daily-refresh
  cancel-in-progress: false

env:
  REFRESH_BRANCH: feature/trash-daily-refresh
  TRASH_UPSTREAM_REVISION: ${{ inputs.upstream_revision || 'master' }}

jobs:
  refresh:
    if: ${{ vars.RULE_PACK_REFRESH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      RULE_PACK_REFRESH_TOKEN: ${{ secrets.RULE_PACK_REFRESH_TOKEN }}
      RULE_PACK_REFRESH_SIGNING_KEY: ${{ secrets.RULE_PACK_REFRESH_SIGNING_KEY }}
      RULE_PACK_REFRESH_ALLOWED_SIGNERS: ${{ vars.RULE_PACK_REFRESH_ALLOWED_SIGNERS }}
      RULE_PACK_HOST_VALIDATION_SHA: ${{ vars.RULE_PACK_HOST_VALIDATION_SHA }}
    steps:
      - name: Require configured refresh credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RULE_PACK_REFRESH_TOKEN" || { echo "RULE_PACK_REFRESH_TOKEN is required" >&2; exit 1; }
          test -n "$RULE_PACK_REFRESH_SIGNING_KEY" || { echo "RULE_PACK_REFRESH_SIGNING_KEY is required for signed commits" >&2; exit 1; }
          test -n "$RULE_PACK_REFRESH_ALLOWED_SIGNERS" || { echo "RULE_PACK_REFRESH_ALLOWED_SIGNERS is required" >&2; exit 1; }
          [[ "$RULE_PACK_HOST_VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "RULE_PACK_HOST_VALIDATION_SHA must be an immutable 40-hex commit" >&2; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RULE_PACK_REFRESH_TOKEN }}

      - name: Capture the integration base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main
          git checkout --detach origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run helper unit tests
        working-directory: rule_packs/refresh
        run: go test ./...

      - name: Run converter regression tests
        working-directory: rule_packs/trash
        run: go test ./...

      - name: Refresh and generate from the resolved upstream revision
        id: refresh
        working-directory: rule_packs/trash
        shell: bash
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/trash-core-previous.json"
          cp snapshot/core-snapshot.json "$previous"
          go run . fetch --revision "$TRASH_UPSTREAM_REVISION" --output snapshot/upstream-raw.json
          go run . distill --snapshot snapshot/upstream-raw.json --output-dir snapshot
          current="$RUNNER_TEMP/trash-scoring-current.json"
          cp ../trash-scoring.json "$current"
          version="$(cd ../refresh && go run . next-version --profile trash --pack ../trash-scoring.json)"
          go run . generate --snapshot snapshot/core-snapshot.json --previous-snapshot "$previous" --output-dir .. --pack-version "$version"
          before="$(cd ../refresh && go run . fingerprint --profile trash --pack "$current")"
          after="$(cd ../refresh && go run . fingerprint --profile trash --pack ../trash-scoring.json)"
          if [ "$before" = "$after" ]; then
            echo "TRaSH scoring policy is unchanged; no refresh needed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          go run . check --snapshot snapshot/core-snapshot.json --previous-snapshot "$previous" --output-dir .. --pack-version "$version"
          {
            echo "changed=true"
            echo "version=$version"
            echo "fingerprint=$after"
          } >> "$GITHUB_OUTPUT"

      - name: Validate the generated pack on the pinned production runtime
        if: ${{ steps.refresh.outputs.changed == 'true' }}
        uses: ./.github/actions/rule-pack-host-validation
        with:
          pack-path: ${{ github.workspace }}/rule_packs/trash-scoring.json
          host-sha: ${{ vars.RULE_PACK_HOST_VALIDATION_SHA }}

      - name: Enforce generated-only diff
        if: ${{ steps.refresh.outputs.changed == 'true' }}
        working-directory: rule_packs/refresh
        run: go run . verify-diff --profile trash --base "${{ steps.base.outputs.sha }}"

      - name: Commit and open the signed refresh pull request
        if: ${{ steps.refresh.outputs.changed == 'true' }}
        uses: ./.github/actions/rule-pack-refresh-pr
        with:
          branch: ${{ env.REFRESH_BRANCH }}
          pack-label: TRaSH
          version: ${{ steps.refresh.outputs.version }}
          fingerprint: ${{ steps.refresh.outputs.fingerprint }}
          paths: |
            rule_packs/trash-scoring.json
            rule_packs/trash-scoring-coverage.json
            rule_packs/trash/snapshot
            rule_packs/trash/generated
          token: ${{ secrets.RULE_PACK_REFRESH_TOKEN }}
          signing-key: ${{ secrets.RULE_PACK_REFRESH_SIGNING_KEY }}
          allowed-signers: ${{ vars.RULE_PACK_REFRESH_ALLOWED_SIGNERS }}
          bot-email: ${{ vars.RULE_PACK_REFRESH_BOT_EMAIL }}
