[package]
name = "aria2-download-client"
version = "2.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-only"
description = "Aria2 XML-RPC torrent download client plugin"

[package.metadata.scryer]
official = true
plugin_id = "aria2"
status = "beta"
catalog_versions = ["v3"]
# Scryer 0.20.0 is the first release whose download-client backing is the
# `scryer:download-client/download-client@1.0.0` component host. Earlier
# releases run the Preview 1 command runtime and cannot instantiate this
# artifact at all, so the floor is load-bearing, not advisory.
# 0.21.21 is the first host that decodes the open error codes this plugin
# sends.
min_scryer_version = "0.21.21"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/download_clients/aria2"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/download_clients/aria2"

# A component, not a Preview 1 command binary: the world's `describe` and
# `process` are exported from the library itself, so there is no `main` and no
# `[[bin]]`. xtask's `select_built_wasm` already accepts either artifact name.
[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
roxmltree = "0.21"
scryer-plugin-sdk = "3.18.0"
scryer-plugin-pdk = "0.8.0"
serde = "1"
serde_json = "1"
# `aria2.addUri` answers with a GID, never with the info hash, and the GID it
# returns for a magnet or a torrent URL belongs to the metadata download aria2
# discards once the metainfo resolves. The plugin therefore derives the identity
# itself: SHA-1 over the bencoded `info` dictionary, the definition Sonarr's
# `ITorrentFileInfoReader.GetHashFromTorrentFile` implements. Same version the
# qbittorrent, utorrent, downloadstation and freebox clients already pin.
sha1 = "0.11"
wit-bindgen = "0.63"

[dev-dependencies]
scryer-plugin-conformance = { path = "../../pdk/scryer-plugin-conformance", features = [
    "download-client",
] }

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
