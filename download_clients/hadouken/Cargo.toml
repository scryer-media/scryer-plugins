[package]
name = "hadouken-download-client"
version = "1.1.3"
edition = "2024"
rust-version = "1.97.1"
autolib = false
license = "GPL-3.0-only"
description = "Hadouken torrent download client plugin"

[package.metadata.scryer]
official = true
plugin_id = "hadouken"
status = "beta"
catalog_versions = ["v3"]
min_scryer_version = "0.18.12"
feature_sets = [{ required_features = [] }, { required_features = ["simd128", "relaxed-simd"] }]
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/download_clients/hadouken"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/download_clients/hadouken"

[[bin]]
name = "hadouken-download-client"
path = "src/lib.rs"

[dependencies]
base64 = "0.23"
scryer-plugin-sdk = "3.7.0"
scryer-plugin-pdk = "0.5.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
