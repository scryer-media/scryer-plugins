[package]
name = "flood-download-client"
version = "1.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-only"
description = "Flood torrent download client plugin"

[package.metadata.scryer]
official = true
plugin_id = "flood"
status = "beta"
catalog_versions = ["v3"]
# TEMPORARY — the placeholder for the first Scryer release whose download-client
# backing is the `scryer:download-client/download-client@1.0.0` component host.
# A Preview 1 command runtime cannot instantiate this artifact at all, so the
# floor has to move with that release; 0.18.23 is the same placeholder the
# archive extractor and the migrated subtitle provider carry. Replace it with
# the real version at release.
min_scryer_version = "0.18.23"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/download_clients/flood"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/download_clients/flood"

# A component, not a Preview 1 command binary: the world's `describe` and
# `process` are exported from the library itself, so there is no `main` and no
# `[[bin]]`. xtask's `select_built_wasm` already accepts either artifact name.
[lib]
crate-type = ["cdylib"]

[dependencies]
# `POST /api/torrents/add-urls` answers with an array of hashes, but only the
# qBittorrent backend fills it — the rTorrent gateway returns `[]` and the route
# answers 202 (`server/services/rTorrent/clientGatewayService.ts:277-341`). The
# plugin therefore derives the identity itself, the way Sonarr's core does
# before it ever calls the client: base32 decoding for a magnet's `btih`, SHA-1
# over the bencoded `info` dictionary for torrent bytes. Same versions the
# aria2, qbittorrent, utorrent, downloadstation and freebox clients already pin.
base64 = "0.23"
scryer-plugin-sdk = { git = "https://github.com/scryer-media/scryer.git", branch = "release-NEXT", version = "3.10.0" }
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
wit-bindgen = "0.61"

[dev-dependencies]
postcard = { version = "1", features = ["use-std"] }
wasmtime = "48.0.1"
wasmtime-wasi = "48.0.1"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
