[package]
name = "rtorrent-download-client"
version = "1.1.2"
edition = "2024"
rust-version = "1.97.1"
autolib = false
license = "GPL-3.0-only"
description = "rTorrent XML-RPC download client plugin"

[package.metadata.scryer]
official = true
plugin_id = "rtorrent"
status = "beta"
catalog_versions = ["v3"]
min_scryer_version = "0.19.0"
feature_sets = [{ required_features = [] }, { required_features = ["simd128", "relaxed-simd"] }]
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/download_clients/rtorrent"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/download_clients/rtorrent"

[[bin]]
name = "rtorrent-download-client"
path = "src/lib.rs"

[dependencies]
base64 = "0.23"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
scryer-plugin-sdk = "3.10.0"
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.5.11" }
serde_json = "1"
urlencoding = "2"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
