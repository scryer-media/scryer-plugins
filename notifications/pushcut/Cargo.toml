[package]
name = "pushcut-notification"
version = "1.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Pushcut notification plugin"

[package.metadata.scryer]
official = true
plugin_id = "pushcut"
status = "beta"
catalog_versions = ["v3"]
# Scryer 0.20.0 is the first release whose notification backing is the
# `scryer:notification/notification@1.0.0` component host. Earlier releases
# run the Preview 1 command runtime and cannot instantiate this artifact at
# all, so the floor is load-bearing, not advisory. Scryer 0.21.11 is the
# first release that sends the `title_moved` event this version handles.
# Scryer 0.21.21 is the first release that decodes the open error codes
# (`invalid_api_key`, `endpoint_not_found`, ...) this version sends.
min_scryer_version = "0.21.21"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/notifications/pushcut"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/notifications/pushcut"

[lib]
crate-type = ["cdylib"]

[dependencies]
notify-common = { path = "../notify-common" }
serde_json = "1"
scryer-plugin-pdk = "0.8.0"
scryer-plugin-sdk = "3.18.0"
wit-bindgen = "0.63"

[dev-dependencies]
scryer-plugin-conformance = { path = "../../pdk/scryer-plugin-conformance", features = [
    "notification",
] }

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
