[package]
name = "pushover-notification"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Pushover notification plugin"

[package.metadata.scryer]
official = true
plugin_id = "pushover"
status = "beta"
catalog_versions = ["v3"]
# Scryer 0.20.0 is the first release whose notification backing is the
# `scryer:notification/notification@1.0.0` component host. Earlier releases
# run the Preview 1 command runtime and cannot instantiate this artifact at
# all, so the floor is load-bearing, not advisory.
min_scryer_version = "0.20.0"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/notifications/pushover"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/notifications/pushover"

[lib]
crate-type = ["cdylib"]

[dependencies]
aes = "0.9"
base64 = "0.23"
cbc = { version = "0.2", features = ["alloc"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.4"
hmac = "0.13"
notify-common = { path = "../notify-common" }
serde_json = "1"
sha2 = "0.11"
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
scryer-plugin-sdk = { git = "https://github.com/scryer-media/scryer.git", branch = "release-NEXT", version = "3.10.0" }
wit-bindgen = "0.61"

[dev-dependencies]
scryer-plugin-conformance = { path = "../../pdk/scryer-plugin-conformance", features = [
    "notification",
] }

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
