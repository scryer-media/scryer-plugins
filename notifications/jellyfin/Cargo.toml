[package]
name = "jellyfin-notification"
version = "1.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Targeted Jellyfin library refresh notifications using mapped media paths and provider-id fallbacks"

[package.metadata.scryer]
official = true
plugin_id = "jellyfin"
catalog_versions = ["v3"]
# Scryer 0.20.0 is the first release whose notification backing is the
# `scryer:notification/notification@1.0.0` component host. Earlier releases
# run the Preview 1 command runtime and cannot instantiate this artifact at
# all, so the floor is load-bearing, not advisory. Scryer 0.21.11 is the
# first release that sends the `title_moved` event this version handles, and
# Scryer 0.21.21 the first that decodes the open error codes this version sends.
min_scryer_version = "0.21.21"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/notifications/jellyfin"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/notifications/jellyfin"

[lib]
crate-type = ["cdylib"]

[dependencies]
scryer-plugin-pdk = "0.8.0"
scryer-plugin-sdk = "3.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.63"

[dev-dependencies]
scryer-plugin-conformance = { path = "../../pdk/scryer-plugin-conformance", features = [
    "notification",
] }

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
