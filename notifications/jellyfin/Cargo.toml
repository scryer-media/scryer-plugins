[package]
name = "jellyfin-notification"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Targeted Jellyfin library refresh notifications using mapped media paths and provider-id fallbacks"

[package.metadata.scryer]
official = true
plugin_id = "jellyfin"
catalog_versions = ["v3"]
# TEMPORARY — the placeholder for the first Scryer release whose notification
# backing is the `scryer:notification/notification@1.0.0` component host. A
# Preview 1 command runtime cannot instantiate this artifact at all, so the
# floor has to move with that release; 0.18.23 is the same placeholder the
# archive extractor and the subtitle components carry. Replace at release.
min_scryer_version = "0.18.23"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/notifications/jellyfin"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/notifications/jellyfin"

[lib]
crate-type = ["cdylib"]

[dependencies]
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
scryer-plugin-sdk = { git = "https://github.com/scryer-media/scryer.git", branch = "release-NEXT", version = "3.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.61"

[dev-dependencies]
postcard = { version = "1", features = ["use-std"] }
wasmtime = "48.0.1"
wasmtime-wasi = "48.0.1"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
