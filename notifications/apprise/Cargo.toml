[package]
name = "apprise-notification"
version = "1.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Apprise notification plugin"

[package.metadata.scryer]
official = true
plugin_id = "apprise"
status = "beta"
catalog_versions = ["v3"]
# Scryer 0.20.0 is the first release whose notification backing is the
# `scryer:notification/notification@1.0.0` component host. Earlier releases
# run the Preview 1 command runtime and cannot instantiate this artifact at
# all, so the floor is load-bearing, not advisory. Scryer 0.21.11 is the
# first release that sends the `title_moved` event this version handles.
min_scryer_version = "0.21.11"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/notifications/apprise"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/notifications/apprise"

[lib]
crate-type = ["cdylib"]

[dependencies]
notify-common = { path = "../notify-common" }
serde_json = "1"
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
scryer-plugin-sdk = "3.12.0"
wit-bindgen = "0.61"

[dev-dependencies]
scryer-plugin-conformance = { path = "../../pdk/scryer-plugin-conformance", features = [
    "notification",
] }

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
