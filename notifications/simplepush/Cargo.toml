[package]
name = "simplepush-notification"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Simplepush notification plugin"

[package.metadata.scryer]
official = true
plugin_id = "simplepush"
status = "beta"
catalog_versions = ["v3"]
# TEMPORARY — the placeholder for the first Scryer release whose notification
# backing is the `scryer:notification/notification@1.0.0` component host. A
# Preview 1 / Extism runtime cannot instantiate this artifact at all, so the
# floor has to move with that release; 0.18.23 is the same placeholder the
# archive extractor and the subtitle components carry. Replace at release.
min_scryer_version = "0.18.23"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/notifications/simplepush"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/notifications/simplepush"

[lib]
crate-type = ["cdylib"]

[dependencies]
notify-common = { path = "../notify-common" }
serde_json = "1"
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
scryer-plugin-sdk = "3.10.0"
wit-bindgen = "0.60"

[dev-dependencies]
postcard = { version = "1", features = ["use-std"] }
wasmtime = "47.0.3"
wasmtime-wasi = "47.0.3"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
