[package]
name = "email-notification"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Plaintext SMTP email notification plugin with plain, STARTTLS, and TLS delivery modes"

[package.metadata.scryer]
official = true
plugin_id = "email"
catalog_versions = ["v3"]
# Scryer 0.20.0 is the first release whose notification backing is the
# `scryer:notification/notification@1.0.0` component host. Earlier releases
# run the Preview 1 command runtime and cannot instantiate this artifact at
# all, so the floor is load-bearing, not advisory.
min_scryer_version = "0.20.0"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/notifications/email"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/notifications/email"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
futures = "0.3"
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
scryer-plugin-sdk = { git = "https://github.com/scryer-media/scryer.git", branch = "release-NEXT", version = "3.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-smtp = { version = "0.15", default-features = false }
wit-bindgen = "0.61"

[dev-dependencies]
postcard = { version = "1", features = ["use-std"] }
wasmtime = "48.0.1"
wasmtime-wasi = "48.0.1"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
