[package]
name = "email-notification"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Plaintext SMTP email notification plugin with plain, STARTTLS, and TLS delivery modes"

[package.metadata.scryer]
official = true
plugin_id = "email"
catalog_versions = ["v3"]
# TEMPORARY — the placeholder for the first Scryer release whose notification
# backing is the `scryer:notification/notification@1.0.0` component host. A
# Preview 1 / Extism runtime cannot instantiate this artifact at all, so the
# floor has to move with that release; 0.18.23 is the same placeholder the
# archive extractor and the subtitle components carry. Replace at release.
min_scryer_version = "0.18.23"
feature_sets = [{ required_features = [] }, { required_features = ["simd128", "relaxed-simd"] }]
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/notifications/email"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/notifications/email"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
futures = "0.3"
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
scryer-plugin-sdk = "3.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-smtp = { version = "0.15", default-features = false }
wit-bindgen = "0.60"

[dev-dependencies]
postcard = { version = "1", features = ["use-std"] }
wasmtime = "47.0.3"
wasmtime-wasi = "47.0.3"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
