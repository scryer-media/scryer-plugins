[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
brotli = "8"
clap = { version = "4", features = ["derive"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
sha2 = "0.11"
tiny-keccak = { version = "2", features = ["shake"] }
blake3 = "1"
postcard = { version = "1", features = ["use-std"] }
scryer-plugin-sdk = "3.10.0"
tempfile = "3"
toml_edit = "0.25"
extism = "1.30"
futures = { version = "0.3", default-features = false, features = ["executor"] }
wasmtime = "48.0.0"
wasmtime-wasi = "48.0.0"
zstd = "0.13"

[dev-dependencies]
aws-lc-sys = "0.44"
crc32fast = "1"
sevenz-rust2 = { version = "0.21", default-features = false, features = ["compress"] }
zip = { version = "8.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.xtask-release]
inherits = "dev"
debug = 0
incremental = false
