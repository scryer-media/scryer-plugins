[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
brotli = "9"
clap = { version = "4", features = ["derive"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
sha2 = "0.11"
tiny-keccak = { version = "2", features = ["shake"] }
blake3 = "1"
postcard = { version = "1", features = ["use-std"] }
scryer-plugin-sdk = "3.20.0"
tempfile = "3"
toml_edit = "0.25"
futures = { version = "0.3", default-features = false, features = ["executor"] }
# wasmtime's defaults minus `cache`: nothing here uses the on-disk compile
# cache, and it pulls in zstd 0.13, which RustSec flags.
wasmtime = { version = "~50.0.0", default-features = false, features = [
    "anyhow",
    "async",
    "backtrace",
    "gc",
    "gc-copying",
    "gc-drc",
    "gc-null",
    "wat",
    "profiling",
    "parallel-compilation",
    "cranelift",
    "pooling-allocator",
    "demangle",
    "addr2line",
    "coredump",
    "debug-builtins",
    "runtime",
    "component-model",
    "component-model-async",
    "threads",
    "stack-switching",
    "std",
    "debug",
    "compile-time-builtins",
    "wit-parser",
] }
# Preview 2 only: the Preview 1 (`p1`) tier pulled in `wiggle` to run
# command-model modules, and there are no core-module plugin artifacts left.
wasmtime-wasi = { version = "~50.0.0", default-features = false, features = ["p2"] }
zstd = "0.14"

[dev-dependencies]
aws-lc-sys = "0.47"
crc32fast = "1"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.xtask-release]
inherits = "dev"
debug = 0
incremental = false
