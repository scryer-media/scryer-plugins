[package]
name = "scryer-plugin-pdk"
version = "0.5.10"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-only"
description = "Guest runtime bindings for Scryer command-model WebAssembly plugins."
repository = "https://github.com/scryer-media/scryer-plugins"
readme = "README.md"
keywords = ["scryer", "plugin", "wasm", "wasip1"]
categories = ["wasm"]

[dependencies]
scryer-plugin-sdk = "3.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
anyhow = "1"
