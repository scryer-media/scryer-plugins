[package]
name = "trakt-list-provider"
version = "1.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Trakt list provider for public lists and a member's watchlist and own lists"

[package.metadata.scryer]
official = true
plugin_id = "trakt-list"
catalog_versions = ["v3"]
# The first Scryer release that links member accounts. The list family
# arrived in 0.21.11, but personal sources need the 0.21.15 account flow and
# the host-supplied app client id.
# Raised to 0.21.21, the first host that decodes the open error codes
# (such as `invalid_response`) this plugin now sends.
min_scryer_version = "0.21.21"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/lists/trakt"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/lists/trakt"

[lib]
crate-type = ["cdylib"]

[dependencies]
list-provider-common = { path = "../list-common" }
scryer-plugin-pdk = "0.8.0"
scryer-plugin-sdk = "3.18.0"
serde_json = "1"
wit-bindgen = { version = "0.63", features = ["async"] }

[dev-dependencies]
list-provider-common = { path = "../list-common", features = ["testing"] }
regex = "1"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
