[package]
name = "tmdb-list-provider"
version = "2.0.2"
edition = "2024"
license = "GPL-3.0-only"
description = "TMDb list provider for public lists, people, companies and keywords, and members' own TMDb lists"

[package.metadata.scryer]
official = true
plugin_id = "tmdb-list"
catalog_versions = ["v3"]
# The first Scryer release that links members' own accounts for list
# providers, and that asks a member for the token this provider declares as
# `member_key`. An older host cannot hand this plugin a member credential.
min_scryer_version = "0.21.15"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/lists/tmdb"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/lists/tmdb"

[lib]
crate-type = ["cdylib"]

[dependencies]
list-provider-common = { path = "../list-common" }
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.7.0" }
scryer-plugin-sdk = "3.15.0"
serde_json = "1"
wit-bindgen = { version = "0.62", features = ["async"] }

[dev-dependencies]
list-provider-common = { path = "../list-common", features = ["testing"] }
regex = "1"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
