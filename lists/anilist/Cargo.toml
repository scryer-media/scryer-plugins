[package]
name = "anilist-list-provider"
version = "1.0.1"
edition = "2024"
license = "GPL-3.0-only"
description = "AniList list provider for a linked member's status and custom anime lists"

[package.metadata.scryer]
official = true
plugin_id = "anilist-list"
catalog_versions = ["v3"]
# The first Scryer release that links member accounts. The list family
# arrived in 0.21.11, but personal sources need the 0.21.15 account flow and
# the member credential it hands this plugin.
min_scryer_version = "0.21.15"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/lists/anilist"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/lists/anilist"

[lib]
crate-type = ["cdylib"]

[dependencies]
list-provider-common = { path = "../list-common" }
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.7.0" }
scryer-plugin-sdk = "3.12.0"
serde_json = "1"
wit-bindgen = { version = "0.61", features = ["async"] }

[dev-dependencies]
list-provider-common = { path = "../list-common", features = ["testing"] }

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
