[package]
name = "mdblist-list-provider"
version = "2.0.1"
edition = "2024"
license = "GPL-3.0-only"
description = "MDBList list provider for public lists, and members' own lists and watchlist"

[package.metadata.scryer]
official = true
plugin_id = "mdblist-list"
catalog_versions = ["v3"]
# The first Scryer release whose host asks a member for the key this provider
# declares as `member_key`. An older host would offer the personal sources with
# no way to link the account they need.
min_scryer_version = "0.21.15"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/lists/mdblist"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/lists/mdblist"

[lib]
crate-type = ["cdylib"]

[dependencies]
list-provider-common = { path = "../list-common" }
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.7.0" }
scryer-plugin-sdk = "3.15.0"
serde_json = "1"
wit-bindgen = { version = "0.62", features = ["async"] }

[dev-dependencies]
list-provider-common = { path = "../list-common", features = ["testing"] }
regex = "1"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
