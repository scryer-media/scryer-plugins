[package]
name = "custom-list-provider"
version = "1.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Custom list provider for RSS, JSON and StevenLu feeds"

[package.metadata.scryer]
official = true
plugin_id = "custom-list"
catalog_versions = ["v3"]
# The first Scryer release whose host serves
# `scryer:lists/list-provider@1.0.0`. An older host has no list family and
# cannot bind this artifact at all.
# Raised to 0.21.21, the first host that decodes the open error codes
# (such as `invalid_response`) this plugin now sends.
min_scryer_version = "0.21.21"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/lists/custom"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/lists/custom"

[lib]
crate-type = ["cdylib"]

[dependencies]
list-provider-common = { path = "../list-common" }
scryer-plugin-pdk = "0.8.0"
scryer-plugin-sdk = "3.18.0"
serde_json = "1"
wit-bindgen = { version = "0.63", features = ["async"] }

[dev-dependencies]
list-provider-common = { path = "../list-common", features = ["testing"] }
regex = "1"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
