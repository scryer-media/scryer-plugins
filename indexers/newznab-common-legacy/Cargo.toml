[package]
name = "newznab-common-legacy"
version = "0.1.4"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
# The path PDK, not the published 0.5.10: 0.5.10's `host.rs` still declares the
# deleted `#[link(wasm_import_module = "scryer:host/v1")]` extern, so every host
# call from this engine was a dead import in a component — the reason
# `subtitles/amenzb` could not be migrated. 0.6.0 reaches Scryer through the
# injected host-services transport instead, which is what makes this engine
# world-agnostic.
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
quick-xml = "0.41"
scryer-plugin-sdk = { git = "https://github.com/scryer-media/scryer.git", branch = "release-NEXT", version = "3.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httpdate = "1"
unicode-normalization = "0.1"
url = "2"

[dev-dependencies]
http = "1"
