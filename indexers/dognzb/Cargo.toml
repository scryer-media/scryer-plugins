[package]
name = "dognzb-indexer"
version = "2.0.4"
edition = "2024"
autolib = false
license = "GPL-3.0-only"
description = "DogNZB-specific Newznab indexer with rating, genre, and comment metadata extraction"

[package.metadata.scryer]
official = false
plugin_id = "dognzb"
catalog_versions = ["v3"]
min_scryer_version = "0.18.17"
max_scryer_version = "0.18.21"
feature_sets = [{ required_features = [] }, { required_features = ["simd128", "relaxed-simd"] }]
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/dognzb"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/dognzb"

[[bin]]
name = "dognzb-indexer"
path = "src/lib.rs"

[dependencies]
indexer-command-compat = { path = "../command-compat" }
scryer-plugin-pdk = "=0.5.10"
newznab-common = { package = "newznab-common-legacy", path = "../newznab-common-legacy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scryer-plugin-sdk = "=3.9.0"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
