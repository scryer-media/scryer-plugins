[package]
name = "eztv-indexer"
version = "0.1.0"
edition = "2024"
autolib = false
license = "GPL-3.0-only"
description = "EZTV public television torrent indexer (beta)"

[package.metadata.scryer]
official = true
status = "beta"
plugin_id = "eztv"
catalog_versions = ["v3"]
min_scryer_version = "0.21.22"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/eztv"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/eztv"

[lib]
name = "eztv_indexer"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
scryer-plugin-pdk = "0.8.0"
scryer-plugin-sdk = "3.20.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
