[package]
name = "torrent-rss-indexer"
version = "2.1.0"
edition = "2024"
autolib = false
license = "GPL-3.0-only"
description = "Generic torrent RSS indexer for trackers and aggregators that expose direct RSS feeds without Torznab"

[package.metadata.scryer]
official = true
plugin_id = "torrent-rss"
catalog_versions = ["v3"]
min_scryer_version = "0.20.0"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/torrent-rss"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/torrent-rss"

[lib]
name = "torrent_rss_indexer"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
quick-xml = "0.42"
scryer-plugin-sdk = { git = "https://github.com/scryer-media/scryer.git", branch = "release-NEXT", version = "3.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
