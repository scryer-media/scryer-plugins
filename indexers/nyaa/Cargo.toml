[package]
name = "nyaa-indexer"
version = "2.1.0"
edition = "2024"
autolib = false
license = "GPL-3.0-only"
description = "Nyaa RSS indexer for anime torrents"

[package.metadata.scryer]
official = true
plugin_id = "nyaa"
status = "beta"
catalog_versions = ["v3"]
min_scryer_version = "0.20.0"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/nyaa"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/nyaa"

[lib]
name = "nyaa_indexer"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
base64 = "0.23"
quick-xml = "0.42"
serde_json = "1"
scryer-plugin-sdk = { git = "https://github.com/scryer-media/scryer.git", branch = "release-NEXT", version = "3.10.0" }
url = "2"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
