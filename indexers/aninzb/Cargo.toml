[package]
name = "aninzb-indexer"
version = "2.0.6"
edition = "2024"
autolib = false
license = "GPL-3.0-only"
description = "AniNZB public API indexer for anime Usenet releases"

[package.metadata.scryer]
official = true
plugin_id = "aninzb"
catalog_versions = ["v3"]
status = "active"
min_scryer_version = "0.18.22"
feature_sets = [{ required_features = [] }, { required_features = ["simd128", "relaxed-simd"] }]
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/aninzb"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/aninzb"

[lib]
name = "aninzb_indexer"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.5.11" }
newznab-common = { path = "../newznab-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scryer-plugin-sdk = "3.10.0"
url = "2"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
