[package]
name = "hdbits-indexer"
version = "2.4.1"
edition = "2024"
autolib = false
license = "GPL-3.0-only"
description = "HDBits JSON torrent indexer"

[package.metadata.scryer]
official = true
plugin_id = "hdbits"
status = "beta"
catalog_versions = ["v3"]
min_scryer_version = "0.21.21"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/hdbits"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/hdbits"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
scryer-plugin-pdk = "0.8.0"
scryer-plugin-sdk = "3.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
