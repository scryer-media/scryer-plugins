[package]
name = "hdbits-indexer"
version = "2.0.4"
edition = "2024"
autolib = false
license = "GPL-3.0-only"
description = "HDBits JSON torrent indexer"

[package.metadata.scryer]
official = true
plugin_id = "hdbits"
status = "beta"
catalog_versions = ["v3"]
min_scryer_version = "0.18.22"
feature_sets = [{ required_features = [] }, { required_features = ["simd128", "relaxed-simd"] }]
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/hdbits"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/hdbits"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.5.11" }
scryer-plugin-sdk = "3.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
