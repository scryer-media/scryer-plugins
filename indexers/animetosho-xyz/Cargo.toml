[package]
name = "animetosho-xyz-indexer"
version = "2.3.0"
edition = "2024"
autolib = false
license = "GPL-3.0-only"
description = "AnimeTosho.xyz Newznab/Torznab feed indexer"

[package.metadata.scryer]
official = true
plugin_id = "animetosho-xyz"
catalog_versions = ["v3"]
min_scryer_version = "0.20.0"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/animetosho-xyz"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/animetosho-xyz"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
newznab-common = { path = "../newznab-common" }
serde_json = "1"
scryer-plugin-sdk = { git = "https://github.com/scryer-media/scryer.git", branch = "release-NEXT", version = "3.10.0" }

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
