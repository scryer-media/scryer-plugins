[package]
name = "cardigann-engine"
version = "0.2.0"
edition = "2024"
autolib = false
license = "GPL-3.0-only"
description = "Prowlarr Cardigann v11 definition engine for Scryer"

[package.metadata.scryer]
official = true
plugin_id = "cardigann-engine"
status = "beta"
catalog_versions = ["v3"]
min_scryer_version = "0.19.5"
feature_sets = [{ required_features = [] }, { required_features = ["simd128", "relaxed-simd"] }]
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/cardigann-engine"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/cardigann-engine"

[lib]
name = "cardigann_engine"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
encoding_rs = "0.8"
html-escape = "0.2"
indexmap = { version = "2", features = ["serde"] }
percent-encoding = "2"
regex = "1"
roxmltree = "0.21"
scraper = "0.24"
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.5.11" }
scryer-plugin-sdk = "3.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
unicode-normalization = "0.1"
url = "2"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
