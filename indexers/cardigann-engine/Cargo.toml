[package]
name = "cardigann-engine"
version = "0.2.1"
edition = "2024"
autolib = false
license = "GPL-3.0-only"
description = "Advanced indexers for Scryer: runs Prowlarr Cardigann v11 tracker definitions"

[package.metadata.scryer]
official = true
plugin_id = "cardigann-engine"
status = "beta"
catalog_versions = ["v3"]
min_scryer_version = "0.20.0"
feature_sets = [{ required_features = [] }, { required_features = ["simd128", "relaxed-simd"] }]
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/cardigann-engine"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/cardigann-engine"

[lib]
name = "cardigann_engine"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
encoding_rs = "0.8"
fancy-regex = "0.18"
html-escape = "0.2"
# Kept in lockstep with `scraper`: the engine stamps `:contains` marker
# attributes onto the parsed DOM, which needs scraper's own `QualName` type.
html5ever = "0.39"
indexmap = { version = "2", features = ["serde"] }
percent-encoding = "2"
regex = "1"
roxmltree = "0.21"
scraper = "0.27"
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
scryer-plugin-sdk = { git = "https://github.com/scryer-media/scryer.git", branch = "release-NEXT", version = "3.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
unicode-normalization = "0.1"
url = "2"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
