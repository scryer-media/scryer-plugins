[package]
name = "torznab-indexer"
version = "2.0.3"
edition = "2024"
autolib = false
license = "GPL-3.0-only"
description = "Generic Torznab-compatible torrent indexer for Jackett and native Torznab feeds"

[package.metadata.scryer]
official = true
plugin_id = "torznab"
catalog_versions = ["v3"]
min_scryer_version = "0.18.17"
feature_sets = [{ required_features = [] }, { required_features = ["simd128", "relaxed-simd"] }]
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/torznab"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/torznab"

[lib]
name = "torznab_indexer"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.5.10" }
newznab-common = { path = "../newznab-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scryer-plugin-sdk = "3.9.0"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
