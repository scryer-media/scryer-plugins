[package]
name = "nzbgeek-indexer"
version = "2.0.4"
edition = "2024"
autolib = false
license = "GPL-3.0-only"
description = "NZBGeek-specific Newznab indexer with metadata extraction (thumbs, subtitles, password detection)"

[package.metadata.scryer]
official = false
plugin_id = "nzbgeek"
catalog_versions = ["v3"]
min_scryer_version = "0.18.17"
max_scryer_version = "0.18.21"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/nzbgeek"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/nzbgeek"

[[bin]]
name = "nzbgeek-indexer"
path = "src/lib.rs"

[dependencies]
indexer-command-compat = { path = "../command-compat" }
# Path PDK / SDK 3.10, forced by the `newznab-common-legacy` bump (see that
# crate's manifest). The exact `=0.5.10` / `=3.9.0` pins became unsatisfiable
# the moment the shared engine moved to PDK 0.6.0, which requires SDK 3.10.
# This plugin's own source is unchanged; it is still a Preview 1 command guest
# and still awaits its component migration.
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
newznab-common = { package = "newznab-common-legacy", path = "../newznab-common-legacy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scryer-plugin-sdk = "3.10.0"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
