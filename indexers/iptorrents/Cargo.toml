[package]
name = "iptorrents-indexer"
version = "2.1.0"
edition = "2024"
autolib = false
license = "GPL-3.0-only"
description = "IPTorrents RSS indexer"

[package.metadata.scryer]
official = true
plugin_id = "iptorrents"
status = "beta"
catalog_versions = ["v3"]
min_scryer_version = "0.18.22"
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/iptorrents"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/iptorrents"

[lib]
name = "iptorrents_indexer"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
rss-indexer-common = { path = "../rss-common" }
serde_json = "1"
scryer-plugin-sdk = "3.10.0"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
