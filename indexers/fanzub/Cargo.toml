[package]
name = "fanzub-indexer"
version = "2.1.0"
edition = "2024"
autolib = false
license = "GPL-3.0-only"
description = "Fanzub RSS indexer for anime Usenet releases"

[package.metadata.scryer]
official = true
plugin_id = "fanzub"
status = "beta"
catalog_versions = ["v3"]
min_scryer_version = "0.18.22"
feature_sets = [{ required_features = [] }, { required_features = ["simd128", "relaxed-simd"] }]
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/fanzub"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/fanzub"

[lib]
name = "fanzub_indexer"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk", version = "0.6.0" }
rss-indexer-common = { path = "../rss-common" }
serde_json = "1"
scryer-plugin-sdk = "3.10.0"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
