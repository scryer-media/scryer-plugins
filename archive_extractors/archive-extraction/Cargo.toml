[package]
name = "archive-extraction-archive-extractor"
version = "1.1.3"
edition = "2024"
autolib = false
license-file = "LICENSE"
description = "Optional archive extraction plugin for RAR, ZIP, 7z, and XZ with PAR2 recovery"

[package.metadata.scryer]
official = true
plugin_id = "archive-extraction"
catalog_versions = ["v3"]
min_scryer_version = "0.21.10"
feature_sets = [{ required_features = [] }, { required_features = ["simd128", "relaxed-simd"] }]
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/archive_extractors/archive-extraction"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/archive_extractors/archive-extraction"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# XZ decodes in pure Rust. `crc-host` hands CRC-32 and CRC-64/XZ to the
# world's `crypto` import — and with them every CRC sevenz-turbo computes,
# since that crate checksums through `lzma_turbo::crc`. The SHA-256 check (type 10) takes
# RustCrypto, because the default AWS-LC backend is C and wasm has no
# toolchain for it.
lzma-turbo = { version = "0.9.0", default-features = false, features = ["std", "asm", "crc", "crc-host", "native-crypto", "xz"] }
par2-rs = { version = "0.10.8", default-features = false }
scryer-plugin-sdk = "3.15.0"
serde_json = "1"
# `crypto-host` hands 7z's bulk AES-256-CBC decrypt to the world's `crypto`
# import, the same seam unrar-rs uses. It is inert off wasm32, so native builds
# take the RustCrypto backend below instead.
sevenz-turbo = { version = "0.27.0", default-features = false, features = ["aes256", "bzip2", "crypto-host", "deflate", "ppmd"] }
unrar-rs = { version = "0.11.0", default-features = false, features = ["crypto-host", "crc-host"] }
wit-bindgen = "0.62"
zip = { version = "9.0.4", default-features = false, features = ["aes-crypto", "deflate-flate2-zlib-rs"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sevenz-turbo = { version = "0.27.0", default-features = false, features = ["native-crypto"] }

[dev-dependencies]
aws-lc-sys = "0.46"
# The conformance harness serves the 1.1.0 catalog `crc` import with the same
# backend the Scryer host uses.
crc-fast = { version = "1.10.0", default-features = false, features = ["std"] }
crc32fast = "1"
par2-rs = "0.10.8"
lzma-turbo = { version = "0.9.0", default-features = false, features = ["enc"] }
sevenz-turbo = { version = "0.27.0", default-features = false, features = ["compress"] }
tempfile = "3"
wasmtime = "48.0.6"
wasmtime-wasi = "48.0.6"

# zip 9 depends on typed-path, whose 0.12.3 release enables
# `#![feature(wasip2)]` unconditionally on wasm32-wasip2 and so fails on the
# pinned stable toolchain. This pins typed-path to upstream main plus
# chipsenkbeil/typed-path#72, which makes that feature opt-in. Drop the patch
# once a typed-path release includes the fix.
[patch.crates-io]
typed-path = { git = "https://github.com/drarijitdas/typed-path", rev = "aa2d542688a1f9feb1edcc74cafa7239dfb4b20e" }

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
