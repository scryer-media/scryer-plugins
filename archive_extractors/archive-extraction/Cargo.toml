[package]
name = "archive-extraction-archive-extractor"
version = "0.1.11"
edition = "2024"
license-file = "LICENSE"
description = "Optional archive extraction plugin for RAR, ZIP, and 7z"

[package.metadata.scryer]
official = true
plugin_id = "archive-extraction"
catalog_versions = ["v3"]
min_scryer_version = "0.18.0"
feature_sets = [{ required_features = [], wasm_opt = "speed" }, { required_features = ["simd128", "relaxed-simd"] }]
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/archive_extractors/archive-extraction"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/archive_extractors/archive-extraction"

[[bin]]
name = "archive_extraction_archive_extractor"
path = "src/main.rs"

[dependencies]
scryer-plugin-pdk = { path = "../../pdk/scryer-plugin-pdk" }
scryer-plugin-sdk = "3.7.0"
serde_json = "1"
sevenz-rust2 = { version = "0.22", default-features = false, features = ["aes256", "bzip2", "deflate", "ppmd"] }
unrar-rs = { version = "0.7.0", default-features = false, features = ["crypto-host", "crc-host", "host-abi-extism"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
aws-lc-sys = "0.45"
crc32fast = "1"
sevenz-rust2 = { version = "0.22", default-features = false, features = ["compress"] }
tempfile = "3"
wasmtime = "47.0.3"
wasmtime-wasi = "47.0.3"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
